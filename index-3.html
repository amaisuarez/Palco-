<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2B20"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Palco · Fútbol</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0F2B20;--surf:#163A2C;--surf2:#1C4635;--line:#2A5A45;--chalk:#EEF0E6;--mute:#9DB5A6;--amber:#F2B544;--red:#E0574F;--win:#7CCB8A;--draw:#C9C4A8;
 --fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Barlow','Segoe UI',Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--chalk);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% -40px,transparent 118px,rgba(238,240,230,.06) 119px,rgba(238,240,230,.06) 121px,transparent 122px) no-repeat,var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input,select{font:inherit;color:var(--chalk);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:150px}
h1,h2,h3,.num{font-family:var(--fd);font-weight:700;letter-spacing:.01em}
h2{font-size:1.5rem;line-height:1.1;margin:22px 0 10px}
h3{font-size:1.15rem;margin:18px 0 8px;color:var(--chalk)}
.mute{color:var(--mute)} .small{font-size:.85rem} .amber{color:var(--amber)} .red{color:var(--red)} .win{color:var(--win)}
.wrap{padding:0 16px}
/* cabecera */
.top{position:sticky;top:0;z-index:5;background:rgba(15,43,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.top .ttl{flex:1;min-width:0}.top .ttl b{font-family:var(--fd);font-size:1.25rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:.78rem;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{flex:none;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;font-family:var(--fd);font-weight:700;font-size:.8rem;color:#fff;border:2px solid rgba(255,255,255,.35)}
.crest.sm{width:24px;height:24px;font-size:.55rem;border-width:1px}
.kpi{text-align:right;font-family:var(--fd);font-size:1.05rem;line-height:1.15}.kpi small{display:block;font-family:var(--fb);font-size:.72rem;color:var(--mute)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:1.1rem}
/* navegación */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;padding:9px 2px 10px;font-size:.72rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button i{font-style:normal;font-size:1.2rem;filter:grayscale(.6)}
nav.tabs button.on{color:var(--chalk)} nav.tabs button.on i{filter:none}
nav.tabs button.on::after{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--amber);border-radius:0 0 3px 3px}
.badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--red);color:#fff;font-size:.65rem;border-radius:9px;padding:0 5px;min-width:16px}
.go{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0));z-index:6;display:flex;justify-content:center;pointer-events:none}
.go button{pointer-events:auto;width:min(528px,calc(100% - 32px));background:var(--amber);color:#1b1405;font-family:var(--fd);font-weight:700;font-size:1.2rem;padding:13px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
/* bloques */
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.list>.it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.list>.it:last-child{border-bottom:0}
.it.tap{cursor:pointer}.it.tap:active{background:var(--surf2)}
.ovr{font-family:var(--fd);font-weight:700;font-size:1.15rem;width:38px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--surf2);flex:none}
.ovr.g1{color:#fff;background:#2f7a4a}.ovr.g2{background:#3f6b2b}.ovr.g3{background:#6b5a23}.ovr.g4{background:#5a3a2a}
.pos{font-family:var(--fd);font-size:.8rem;width:36px;text-align:center;border:1px solid var(--line);border-radius:5px;padding:1px 0;flex:none}
.pos.GK{border-color:#c9a23a;color:#e8c766}.pos.DF{border-color:#3f8fbf;color:#8cc6ea}.pos.MF{border-color:#4ea36a;color:#9ed8ae}.pos.FW{border-color:#c4554e;color:#ef9a93}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sub{font-size:.8rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;background:var(--surf2);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--amber);color:#1b1405;border-color:var(--amber)}
.btn.dan{border-color:var(--red);color:var(--red)}
.btn.full{width:100%}.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns .btn{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;padding:7px 12px;border-radius:20px;border:1px solid var(--line);font-size:.85rem;color:var(--mute)}
.chip.on{background:var(--chalk);color:var(--bg);border-color:var(--chalk);font-weight:600}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--win)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px}.stat b{font-family:var(--fd);font-size:1.35rem;display:block;line-height:1.1}.stat span{font-size:.75rem;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:.75rem}
td.l,th.l{text-align:left}tr.me td{background:rgba(242,181,68,.12)}
.zone-cl td:first-child{box-shadow:inset 3px 0 #3f8fbf}.zone-el td:first-child{box-shadow:inset 3px 0 #c98a2a}.zone-rel td:first-child{box-shadow:inset 3px 0 var(--red)}
.form{display:inline-flex;gap:2px}.form i{width:7px;height:7px;border-radius:50%;display:inline-block}.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--red)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,15,10,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:18px 16px 28px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .close{float:right}
/* marcador */
.score{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.score .tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:.9rem;min-width:0}
.score .res{font-family:var(--fd);font-weight:700;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.score .min{font-family:var(--fd);color:var(--amber);font-size:1rem;text-align:center}
.ticker{margin-top:10px;max-height:280px;overflow-y:auto}
.ev{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:.9rem}.ev .m{font-family:var(--fd);color:var(--mute);width:30px;flex:none;text-align:right}
.ev.a{flex-direction:row-reverse;text-align:right}.ev.a .m{text-align:left}
.ev.goal{font-weight:700}
.cmp{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:.85rem;margin:7px 0}
.cmp .t{text-align:center;color:var(--mute);font-size:.75rem;grid-column:1/4;margin-bottom:-6px}
.cmp .b{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--bg)}.cmp .b i{background:var(--chalk)}.cmp .b em{background:var(--amber);margin-left:auto}
.cmp .v{font-family:var(--fd);font-size:1.05rem}.cmp .v:last-child{text-align:right}
.hero{padding:48px 20px 18px}
.hero h1{font-size:3.4rem;line-height:.92;letter-spacing:-.01em}
.hero p{color:var(--mute);margin-top:12px;max-width:34ch}
.pick{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.pick b{font-family:var(--fd);font-size:1.4rem;display:block}.pick span{color:var(--mute);font-size:.9rem}
.msg{padding:12px 4px;border-bottom:1px solid var(--line)}.msg.unread b::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:7px;vertical-align:1px}
.msg p{font-size:.9rem;color:var(--mute);margin-top:3px}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:600;max-width:90%;text-align:center}
.attr{display:grid;grid-template-columns:72px 30px 1fr;gap:8px;align-items:center;font-size:.85rem;margin:5px 0}
.attr b{font-family:var(--fd);font-size:1rem;text-align:right}
.moment{font-size:1.15rem;line-height:1.4;margin:14px 0 6px}
label.f{display:block;margin:12px 0 4px;font-size:.85rem;color:var(--mute)}
.step{display:flex;align-items:center;gap:10px}.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:1.2rem}
</style></head>

function nid(){return G.nextId++}
function calcOvr(p){const w=W[p.pos];let s=0;for(const k in w)s+=w[k]*p.a[k];return Math.round(s)}
function genAttrs(pos,ovr){
  const w=W[pos],a={};
  for(const k of ATTRS){ if(w[k]) a[k]=ovr+gauss(0,3.5); else a[k]= k==='gk'? rnd(8,20) : (pos==='POR'? rnd(25,55) : ovr-rnd(12,30)); }
  let cur=0;for(const k in w)cur+=w[k]*a[k];const d=ovr-cur;
  for(const k of ATTRS){ if(w[k]) a[k]+=d; a[k]=Math.round(clamp(a[k],5,99)); }
  return a;
}

function makePlayer({pos,ovr,age,nat,pot,clubId,season}){
  ovr=Math.round(clamp(ovr,40,93));
  const p={id:nid(),name:genName(nat),nat,pos,age,a:genAttrs(pos,ovr),pot:0,clubId:clubId??null,
    morale:60+rint(-10,15),form:6.6,inj:0,susp:0,yel:0,
    pers:{amb:rint(20,95),loy:rint(20,95),pro:rint(30,95)},
    st:{apps:0,g:0,as:0,yc:0,rc:0,rs:0},contract:(season||2026)+rint(1,4),listed:false};
  p.ovr=calcOvr(p);
  p.pot=pot? Math.round(Math.max(pot,p.ovr)) : Math.round(Math.max(p.ovr, p.ovr + (age<=20? rnd(3,12): age<=23? rnd(1,7): age<=26? rnd(0,3):0)));
  p.wage=wageFor(p.ovr); p.value=valueOf(p,season||2026); p.clause=Math.round(p.value*rnd(2.2,4.5)/1e5)*1e5;
  return p;
}
function wageFor(ovr){return Math.max(40000,Math.round(Math.pow(10,(ovr-45)/15)*28000/1000)*1000)}
function valueOf(p,season){
  if(!G && !season) season=2026;
  const s=season||G.season;
  let eff=p.ovr; if(p.age<24) eff=p.ovr+(p.pot-p.ovr)*(p.age<=20?0.55:0.35);
  let v=Math.pow(10,(Math.min(eff,93)-50)/14)*140000;
  const age=p.age; v*= age<=21?1.25: age<=27?1.1: age<=30?0.85: age<=32?0.55: age<=34?0.3:0.15;
  const yl=(p.contract||s)-s; if(yl<=0) v*=0.45; else if(yl===1) v*=0.7;
  return Math.max(25000,Math.round(v/50000)*50000);
}

function shortName(n){const m={'Real Madrid':'RMA','FC Barcelona':'BAR','Atlético de Madrid':'ATM','Athletic Club':'ATH','Manchester City':'MCI','Manchester United':'MUN','Paris Saint-Germain':'PSG','Paris FC':'PFC','AC Milan':'MIL','AS Roma':'ROM','Real Betis':'BET','Real Sociedad':'RSO','Real Oviedo':'OVI','Bayern Múnich':'FCB','Borussia Dortmund':'BVB','Borussia Mönchengladbach':'BMG','Bayer Leverkusen':'B04','1. FC Köln':'KOE','West Ham United':'WHU','Newcastle United':'NEW','Leeds United':'LEE','Lens':'RCL','Le Havre':'HAC','St. Pauli':'STP','Union Berlin':'FCU'};return m[n]||norm(n).replace(/ /g,'').slice(0,3).toUpperCase()}

// ---------- calendario ----------
function makeFixtures(ids){
  const t=[...ids].sort(()=>R()-0.5); const n=t.length, rounds=[];
  const arr=[...t];
  for(let r=0;r<n-1;r++){
    const rd=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i]; rd.push(r%2===0? [a,b]:[b,a]);}
    rounds.push(rd); arr.splice(1,0,arr.pop());
  }
  const second=rounds.map(rd=>rd.map(([a,b])=>[b,a]));
  return rounds.concat(second);
}
function newSeasonLeague(lg){
  lg.fixtures=makeFixtures(lg.clubIds); lg.results=lg.fixtures.map(()=>[]);
  lg.table={}; for(const id of lg.clubIds) lg.table[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]};
}
function standings(lg){
  return lg.clubIds.map(id=>({id,...lg.table[id]})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||G.clubs[b.id].rep-G.clubs[a.id].rep);
}
function leagueOf(clubId){const c=G.clubs[clubId];return G.leagues.find(l=>l.id===c.leagueId)}
function maxWeeks(){return Math.max(...G.leagues.map(l=>l.fixtures.length))}
function windowOpen(){return G.phase==='pre' || (G.phase==='season' && G.week>=19 && G.week<=21)}

}

// ---------- alineaciones y fuerza ----------
function available(p){return p && p.inj<=0 && p.susp<=0}
function fit(p,slot){if(p.pos===slot)return 0; if((slot==='LD'&&p.pos==='LI')||(slot==='LI'&&p.pos==='LD')||(slot==='ED'&&p.pos==='EI')||(slot==='EI'&&p.pos==='ED'))return -2;
  if(GROUP[p.pos]===GROUP[slot])return -4; if(GROUP[slot]==='GK'||GROUP[p.pos]==='GK')return -40; return -12}
function bestXI(club){
  const pool=club.squad.map(id=>G.players[id]).filter(available);
  const used=new Set(), xi=[];
  const order=[0,2,3,1,4,5,6,7,9,8,10];
  for(const i of order){
    const slot=FORMATION[i]; let best=null,bs=-1e9;
    for(const p of pool){ if(used.has(p.id))continue;
      let s=p.ovr+fit(p,slot)+(p.form-6.6)*1.5;
      if(G.mode==='player' && p.id===G.userPlayerId) s+=(G.rel-50)/12;
      if(s>bs){bs=s;best=p} }
    if(best){used.add(best.id); xi[i]={slot,pid:best.id,eff:best.ovr+fit(best,slot)}}
  }
  return xi.filter(Boolean);
}
function benchOf(club,xi){const s=new Set(xi.map(x=>x.pid));return club.squad.map(id=>G.players[id]).filter(p=>available(p)&&!s.has(p.id)).sort((a,b)=>b.ovr-a.ovr).slice(0,7)}
function teamStrength(club,xi){
  const g={GK:[],DF:[],MF:[],FW:[]};
  for(const x of xi) g[GROUP[x.slot]].push(x.eff);
  const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:40;
  const pen=(11-xi.length)*3;
  let A=0.55*avg(g.FW)+0.35*avg(g.MF)+0.1*avg(g.DF)-pen, D=0.5*avg(g.DF)+0.3*avg(g.GK)+0.2*avg(g.MF)-pen, M=avg(g.MF)-pen;
  const co=G.coaches[club.coachId];
  const cq=co?(co.q-70)/8:-2; A+=cq; D+=cq; M+=cq;
  const st=co?co.style:'Equilibrado';
  if(st==='Ofensivo'){A+=2;D-=1.5} else if(st==='Defensivo'){A-=1.5;D+=2} else if(st==='Posesión'){M+=2.5;A+=0.5} else if(st==='Contraataque'){A+=1.5;M-=1.5}
  const mor=xi.reduce((s,x)=>s+G.players[x.pid].morale,0)/Math.max(1,xi.length);
  const mm=(mor-60)/25; A+=mm; D+=mm; M+=mm;
  return {A,D,M};
}

// ---------- simulación de partido ----------
function simMatch(hid,aid,opt={}){
  const H=G.clubs[hid],A=G.clubs[aid];
  const hx=bestXI(H),ax=bestXI(A); const hs=teamStrength(H,hx),as=teamStrength(A,ax);
  hs.A+=1.5;hs.D+=1.5;hs.M+=1;
  const xgH=1.27*Math.exp((hs.A-as.D)/22+(hs.M-as.M)/50), xgA=1.0*Math.exp((as.A-hs.D)/22+(as.M-hs.M)/50);
  const poss=clamp(0.5+(hs.M-as.M)/50+gauss(0,0.03),0.28,0.72);
  const ev=[], st={h:{sh:0,sot:0,xg:0,co:0,yc:0,rc:0,fo:0},a:{sh:0,sot:0,xg:0,co:0,yc:0,rc:0,fo:0}};
  const rat={}; for(const x of hx)rat[x.pid]=6.3+gauss(0,0.35); for(const x of ax)rat[x.pid]=6.3+gauss(0,0.35);
  let hg=0,ag=0; const sent={}; if(opt.subPid)rat[opt.subPid]=6.4;
  const sides={h:{xi:hx,xg:xgH,club:H},a:{xi:ax,xg:xgA,club:A}};
  const shooterW=x=>{const p=G.players[x.pid];const g=GROUP[x.slot];return (g==='FW'?(x.slot==='DC'?2.3:1.8):g==='MF'?1.3:g==='DF'?0.55:0)*(p.a.sho/70)**1.3};
  const assistW=x=>{const p=G.players[x.pid];const g=GROUP[x.slot];return (g==='MF'?3:g==='FW'?2.2:g==='DF'?1:0.05)*(p.a.pas/70)**2};
  const minutes=90+rint(1,5);
  for(let m=1;m<=minutes;m++){
    for(const s of ['h','a']){
      const S=sides[s], o=s==='h'?'a':'h', active=S.xi.filter(x=>!sent[x.pid]);
      const redPen=(S.xi.length-active.length)*0.18;
      if(R()< S.xg*(1-redPen)/(90*0.105)){
        const sh=wpick(active,shooterW); if(!sh)continue;
        const xg=Math.min(0.75,-Math.log(1-R()*0.999)*0.105+0.015);
        const p=G.players[sh.pid]; const gk=sides[o].xi.find(x=>x.slot==='POR'); const gkv=gk?G.players[gk.pid].a.gk:50;
        const conv=xg*clamp(1+(p.a.sho-gkv)/110,0.65,1.35);
        st[s].sh++; st[s].xg+=xg;
        if(R()<conv){
          st[s].sot++; if(s==='h')hg++;else ag++;
          let as=null; if(R()<0.74){const c=active.filter(x=>x.pid!==sh.pid);as=wpick(c,assistW)}
          ev.push({m,t:'goal',s,pid:sh.pid,as:as?as.pid:null,xg});
          rat[sh.pid]+=1.05; if(as)rat[as.pid]+=0.6;
          for(const x of sides[o].xi){const g=GROUP[x.slot];if(g==='GK'||g==='DF')rat[x.pid]-=0.22}
        } else {
          const on=R()<0.38; if(on){st[s].sot++; if(gk)rat[gk.pid]+=0.12;}
          if(xg>0.25) ev.push({m,t:'chance',s,pid:sh.pid,xg,on});
          if(R()<0.33)st[s].co++;
        }
      }
      if(R()<0.11){st[s].fo++; if(R()<0.17){const f=pick(active); if(f){const p=G.players[f.pid];
        if(R()<0.035 || (p._y&&R()<0.5)){ if(p._y&&!sent[f.pid]){st[s].rc++;sent[f.pid]=1;ev.push({m,t:'red',s,pid:f.pid});rat[f.pid]-=1.3} else if(!p._y){p._y=1;st[s].yc++;ev.push({m,t:'yellow',s,pid:f.pid});rat[f.pid]-=0.2}}
        else if(!p._y){p._y=1;st[s].yc++;ev.push({m,t:'yellow',s,pid:f.pid});rat[f.pid]-=0.2}
      }}}
      if(R()<0.0011){const f=pick(active);if(f&&!f._inj){ev.push({m,t:'inj',s,pid:f.pid});f._inj=1}}
    }
  }
  // eventos forzados (modo jugador)
  if(opt.forced) for(const f of opt.forced){
    if(f.t==='goal'){ if(f.s==='h')hg++;else ag++; st[f.s].sh++;st[f.s].sot++;st[f.s].xg+=f.xg||0.3; ev.push({m:f.m,t:'goal',s:f.s,pid:f.pid,as:f.as||null,xg:f.xg||0.3}); if(rat[f.pid]!=null)rat[f.pid]+=1.05; if(f.as&&rat[f.as]!=null)rat[f.as]+=0.6; }
    if(f.t==='save'){ const o=f.s==='h'?'a':'h'; const i=ev.findIndex(e=>e.t==='goal'&&e.s===o); if(i>=0){ev[i]={...ev[i],t:'chance',on:true};if(o==='h')hg--;else ag--;} }
    if(f.rd && rat[f.pid]!=null) rat[f.pid]+=f.rd;
  }
  if(opt.subPid){const sp=opt.subPid;rat[sp]=(rat[sp]??6.4);}
  ev.sort((a,b)=>a.m-b.m);
  for(const s of ['h','a']){const S=sides[s],gf=s==='h'?hg:ag,ga=s==='h'?ag:hg;const r=gf>ga?0.45:gf<ga?-0.35:0;
    for(const x of S.xi){rat[x.pid]+=r; if(ga===0&&['GK','DF'].includes(GROUP[x.slot]))rat[x.pid]+=0.5; rat[x.pid]=Math.round(clamp(rat[x.pid],3,10)*10)/10;}}
  if(opt.subPid){const sp=opt.subPid,sd=opt.subSide,gf=sd==='h'?hg:ag,ga=sd==='h'?ag:hg;rat[sp]=Math.round(clamp(rat[sp]+(gf>ga?0.3:gf<ga?-0.2:0),3,10)*10)/10;}
  for(const x of hx.concat(ax)){const p=G.players[x.pid];delete p._y}
  return {h:hid,a:aid,hg,ag,ev,st,rat,sub:opt.subPid?{pid:opt.subPid,s:opt.subSide}:null,hx:hx.map(x=>({...x})),ax:ax.map(x=>({...x})),poss:Math.round(poss*100),xgH,xgA};
}
function applyMatch(lg,res){
  const th=lg.table[res.h],ta=lg.table[res.a];
  const upd=(t,gf,ga)=>{t.p++;t.gf+=gf;t.ga+=ga;const r=gf>ga?'W':gf<ga?'L':'D';if(r==='W'){t.w++;t.pts+=3}else if(r==='D'){t.d++;t.pts++}else t.l++;t.form=(t.form.concat(r)).slice(-5)};
  upd(th,res.hg,res.ag);upd(ta,res.ag,res.hg);
  for(const [s,xi] of [['h',res.hx],['a',res.ax]]){
    const gf=s==='h'?res.hg:res.ag, ga=s==='h'?res.ag:res.hg;
    for(const x of xi){const p=G.players[x.pid];p.st.apps++;const r=res.rat[x.pid];p.st.rs+=r;p.form=p.form*0.7+r*0.3;
      p.morale=clamp(p.morale+(gf>ga?3:gf<ga?-3:0)+(r>=7.5?2:r<6?-2:0),5,100);}
  }
  if(res.sub){const p=G.players[res.sub.pid];p.st.apps++;p.st.rs+=res.rat[p.id];p.form=p.form*0.7+res.rat[p.id]*0.3;}
  for(const e of res.ev){const p=G.players[e.pid];if(!p)continue;
    if(e.t==='goal'){p.st.g++;if(e.as&&G.players[e.as])G.players[e.as].st.as++}
    if(e.t==='yellow'){p.st.yc++;p.yel++;if(p.yel>=5){p.susp=2;p.yel=0}}
    if(e.t==='red'){p.st.rc++;p.susp=3}
    if(e.t==='inj'){p.inj=rint(1,8)}
  }
  // banquillo: baja la moral si no juega
  for(const cid of [res.h,res.a]){const c=G.clubs[cid];const s=new Set((cid===res.h?res.hx:res.ax).map(x=>x.pid));
    for(const id of c.squad){if(!s.has(id)){const p=G.players[id];if(p.ovr>=c._base)p.morale=clamp(p.morale-1,5,100)}}}
}
function clubBase(c){const o=c.squad.map(id=>G.players[id].ovr).sort((a,b)=>b-a).slice(0,11);return o.reduce((s,v)=>s+v,0)/Math.max(1,o.length)}

// ---------- semana ----------
function userClub(){return G.clubs[G.userClubId]}
function userPlayer(){return G.players[G.userPlayerId]}
function userFixture(){
  if(G.phase!=='season')return null; const c=G.mode==='player'?G.clubs[userPlayer().clubId]:userClub(); if(!c)return null;
  const lg=leagueOf(c.id); const rd=lg.fixtures[G.week-1]; if(!rd)return null;
  const f=rd.find(([h,a])=>h===c.id||a===c.id); return f?{h:f[0],a:f[1],lg}:null;
}
function msg(title,body,extra={}){G.inbox.unshift({id:G.msgSeq++,title,body,week:dateLabel(),read:false,...extra});G.inbox=G.inbox.slice(0,80)}
function news(t){G.news.unshift({t,d:dateLabel()});G.news=G.news.slice(0,60)}

function advance(forced,subInfo){
  if(G.gameOver)return;
  for(const c of Object.values(G.clubs))c._base=clubBase(c);
  if(G.phase==='pre'){
    aiTransferRound(); aiTransferRound(); offersToUser(); weeklyFinance(false); weeklyPlayerMode(false);
    G.pre++; if(G.pre>=4){G.phase='season';G.week=1;startSeasonHooks();}
    expireOffers(); return {type:'pre'};
  }
  // jornada
  let userRes=null;
  for(const lg of G.leagues){
    const rd=lg.fixtures[G.week-1]; if(!rd)continue;
    for(const [h,a] of rd){
      const isUser=(G.mode==='pres'&&(h===G.userClubId||a===G.userClubId))||(G.mode==='player'&&userPlayer()&&(h===userPlayer().clubId||a===userPlayer().clubId));
      const res=simMatch(h,a,isUser?{forced,subPid:subInfo&&subInfo.pid,subSide:subInfo&&(h===subInfo.club?'h':'a')}:{}); applyMatch(lg,res); lg.results[G.week-1].push({h,a,hg:res.hg,ag:res.ag});
      if(isUser){userRes=res;}
    }
  }
  // lesiones / sanciones avanzan
  for(const p of Object.values(G.players)){if(p.inj>0)p.inj--; else if(p.susp>0 && !p._justSusp)p.susp--; }
  if(userRes){G.lastMatch={...userRes,week:G.week,lgId:leagueOf(userRes.h).id}; afterUserMatch(userRes);}
  if(windowOpen()){aiTransferRound();offersToUser();}
  weeklyFinance(userRes&&userRes.h===G.userClubId); weeklyPlayerMode(true,userRes);
  weeklyDevelopment();
  if(G.week===18) msg('Mercado de invierno','La ventana de fichajes de invierno abre la próxima semana y dura tres jornadas.');
  if(G.week===21) expireOffers(true);
  G.week++;
  if(G.mode==='pres'&&G.approval<10&&!G.gameOver){G.gameOver={reason:'Los socios han aprobado una moción de censura. Has sido destituido como presidente.'};}
  if(G.week>maxWeeks()) return {type:'end',summary:endSeason(),userRes};
  return {type:'match',userRes};
}
function expireOffers(force){G.inbox.forEach(m=>{if(m.offer&&(force||!windowOpen())&&!m.done){m.done='expirada'}});}

function startSeasonHooks(){
  if(G.mode==='pres'){
    const c=userClub(),lg=leagueOf(c.id);
    const rank=[...lg.clubIds].sort((a,b)=>G.clubs[b].rep-G.clubs[a].rep).indexOf(c.id)+1;
    const n=lg.clubIds.length;
    let o; if(rank<=2)o={text:'Ganar la liga',pos:1}; else if(rank<=4)o={text:'Terminar entre los 4 primeros',pos:4};
    else if(rank<=7)o={text:'Clasificar para Europa (top 7)',pos:7}; else if(rank<=12)o={text:'Terminar en la mitad alta',pos:10};
    else o={text:'Evitar el descenso',pos:n-3};
    G.objective=o; msg('Objetivo de la junta',`La junta directiva espera: ${o.text.toLowerCase()}. Cumplirlo es clave para la confianza de los socios.`);
  }
  msg('Arranca la temporada',`Comienza la temporada ${G.season}/${String(G.season+1).slice(2)}. El mercado queda cerrado hasta enero.`);
}

// ---------- finanzas (presidente) ----------
function seasonIncome(c){
  const lg=G.leagues.find(l=>l.id===c.leagueId); const n=lg.clubIds.length;
  const tv=0.7*lg.tv/n*(0.55+0.9*Math.pow(c.rep/100,2));
  const merch=Math.pow(c.rep/100,6)*200e6;
  return {tv,merch,sponsor:c.sponsor&&c.sponsor.until>=G.season?c.sponsor.annual:sponsorValue(c.rep)*0.3};
}
function wageBill(c){return c.squad.reduce((s,id)=>s+G.players[id].wage,0)+(G.coaches[c.coachId]?.wage||0)}
function fairPrice(c){return Math.round(12+c.rep*0.4)}
function attendance(c){
  const t=leagueOf(c.id).table[c.id]; const pts=t.p?t.pts/t.p:1.4;
  let d=0.55+c.rep/220+(G.approval-50)/250+(pts-1.4)/8-(c.ticket-fairPrice(c))/fairPrice(c)*0.7;
  return Math.round(c.cap*clamp(d,0.25,1));
}
function wageBudget(c){const i=seasonIncome(c);return Math.round((i.tv+i.merch+i.sponsor+c.cap*fairPrice(c)*17)*0.82)}
function weeklyFinance(homeMatch){
  if(G.mode!=='pres')return; const c=userClub(); const steps=4+maxWeeks();
  const inc=seasonIncome(c); let delta=0; const f=c.fin||(c.fin={tv:0,tickets:0,merch:0,sponsor:0,wages:0,ops:0,transfers:0,prizes:0,works:0});
  const add=(k,v)=>{f[k]+=v;delta+=v};
  add('tv',inc.tv/steps);add('merch',inc.merch/steps);add('sponsor',inc.sponsor/steps);
  if(homeMatch){const at=attendance(c);c.lastAtt=at;add('tickets',at*c.ticket);}
  add('wages',-wageBill(c)/steps); add('ops',-(c.cap*300+c.rep*c.rep*3000+c.fac.train*1.5e6+c.fac.youth*1.2e6)/steps);
  c.balance+=delta;
  if(c.ticket>fairPrice(c)*1.3)G.approval=clamp(G.approval-0.3,0,100);
  if(c.balance<-50e6)G.approval=clamp(G.approval-0.4,0,100);
  if(c.stadiumWork>0){c.stadiumWork--; if(c.stadiumWork===0){c.cap+=c.stadiumAdd;msg('Obras terminadas',`La ampliación del estadio ha terminado. Nuevo aforo: ${c.cap.toLocaleString('es-ES')} espectadores.`)}}
}
function afterUserMatch(res){
  if(G.mode!=='pres')return; const me=res.h===G.userClubId?'h':'a'; const gf=me==='h'?res.hg:res.ag, ga=me==='h'?res.ag:res.hg;
  const c=userClub(); const opp=G.clubs[me==='h'?res.a:res.h]; const diff=(opp.rep-c.rep)/20;
  G.approval=clamp(G.approval+(gf>ga?0.9+diff*0.5:gf<ga?-1.1+diff*0.5:diff*0.4),0,100);
}

// ---------- desarrollo ----------
function weeklyDevelopment(){
  if(G.week%10!==0)return;
  for(const p of Object.values(G.players)){
    if(G.mode==='player'&&p.id===G.userPlayerId)continue;
    if(p.age<=22&&p.ovr<p.pot&&R()<0.35){growAttr(p,1);p.value=valueOf(p)}
  }
}
function growAttr(p,amt,focusKeys){
  const keys=focusKeys||Object.keys(W[p.pos]); const k=wpick(keys,k=>(W[p.pos][k]||0.08)+0.05);
  p.a[k]=clamp(p.a[k]+amt,5,99); const o=p.ovr; p.ovr=calcOvr(p); if(p.ovr>p.pot&&amt>0&&!focusKeys){p.a[k]-=amt;p.ovr=o}
}
function seasonDevelopment(p,minutesShare){
  let d;const gap=p.pot-p.ovr,c=G.clubs[p.clubId];const tf=c?0.85+c.fac.train*0.06:0.8;const mp=0.7+minutesShare*0.6;
  if(p.age<=20)d=gap*rnd(0.2,0.45)*tf*mp; else if(p.age<=23)d=gap*rnd(0.15,0.35)*tf*mp; else if(p.age<=27)d=rnd(-0.5,1.5);
  else if(p.age<=30)d=rnd(-1.5,0.8); else if(p.age<=32)d=rnd(-3,0); else d=rnd(-5,-1);
  d=Math.round(d); if(!d)return;
  const keys=Object.keys(W[p.pos]); for(let i=0;i<Math.abs(d)*3;i++){growAttr(p,Math.sign(d),d>0?null:keys.concat(['pac','phy']));}
  if(d<0){p.a.pac=clamp(p.a.pac-rint(0,2),5,99);p.ovr=calcOvr(p)}
}

// ---------- mercado IA ----------
function groupCount(c){const g={GK:0,DF:0,MF:0,FW:0};for(const id of c.squad)g[GROUP[G.players[id].pos]]++;return g}
function movePlayer(p,toId,fee,wage,years){
  const from=p.clubId?G.clubs[p.clubId]:null;
  if(from){from.squad=from.squad.filter(i=>i!==p.id);}
  if(toId){G.clubs[toId].squad.push(p.id);}
  p.clubId=toId||null; p.listed=false; p.yel=0;
  if(toId){p.wage=wage||Math.max(p.wage,wageFor(p.ovr));p.contract=G.season+(years||rint(2,5));p.clause=Math.round(valueOf(p)*rnd(2.2,4.5)/1e5)*1e5;p.morale=clamp(p.morale+10,5,100)}
  p.value=valueOf(p);
}
function aiClubs(){return Object.values(G.clubs).filter(c=>!(G.mode==='pres'&&c.id===G.userClubId))}
function aiTransferRound(){
  const all=Object.values(G.players);
  for(const c of aiClubs()){
    if(R()>(c.squad.length<23?1:0.3))continue;
    const g=groupCount(c); let need=Object.keys(MIN_GROUP).find(k=>g[k]<MIN_GROUP[k]);
    const base=c._base||clubBase(c);
    let minO, maxO;
    if(need){minO=base-8;maxO=base+3}
    else { if(R()>0.45)continue;
      const xi=bestXI(c); const weak=xi.slice().sort((a,b)=>a.eff-b.eff)[0]; if(!weak)continue;
      need=GROUP[weak.slot]; minO=weak.eff+2; maxO=weak.eff+9; if(c.squad.length>=30)continue; }
    let best=null,bs=-1;
    for(let i=0;i<260;i++){
      const p=all[Math.floor(R()*all.length)];
      if(!p||p.clubId===c.id||GROUP[p.pos]!==need||p.ovr<minO||p.ovr>maxO||p.age>31)continue;
      if(G.mode==='player'&&p.id===G.userPlayerId)continue;
      const seller=p.clubId?G.clubs[p.clubId]:null;
      if(seller&&seller.rep>c.rep+4)continue;
      const fee=seller?Math.round(p.value*rnd(1,1.35)/1e5)*1e5:0;
      if(fee>c.budget)continue;
      if(seller&&G.mode==='pres'&&seller.id===G.userClubId)continue;
      if(seller){const sg=groupCount(seller); if(sg[need]<=MIN_GROUP[need])continue;}
      const sc=p.ovr+(p.pot-p.ovr)*0.3-fee/2e7+(seller?0:3);
      if(sc>bs){bs=sc;best={p,fee,seller}}
    }
    if(best){
      const {p,fee,seller}=best; c.budget-=fee; if(seller)seller.budget+=fee*0.75;
      const fromName=seller?seller.name:'libre';
      movePlayer(p,c.id,fee,Math.round(Math.max(p.wage*1.1,wageFor(p.ovr))/1000)*1000);
      if(fee>=15e6||(G.mode==='player'&&seller&&seller.id===userPlayer()?.clubId)||(G.mode==='pres'&&false))
        news(`${c.name} ficha a ${p.name} (${fromName}) por ${fmtM(fee)}.`);
      if(G.mode==='player'&&seller&&seller.id===userPlayer().clubId) msg('Movimiento en el vestuario',`${p.name} deja el club rumbo a ${c.name}.`);
    }
    // vender excedentes
    if(c.squad.length>30){const worst=c.squad.map(id=>G.players[id]).filter(p=>!(G.mode==='player'&&p.id===G.userPlayerId)).sort((a,b)=>a.ovr-b.ovr)[0];if(worst)movePlayer(worst,null)}
  }
}
function offersToUser(){
  if(G.mode!=='pres'||R()>0.4)return; const c=userClub();
  const cands=c.squad.map(id=>G.players[id]).filter(p=>p.value>1.5e6);
  if(!cands.length)return; const p=wpick(cands,p=>p.ovr**3*(p.listed?4:1));
  const buyers=Object.values(G.clubs).filter(b=>b.id!==c.id&&b.rep>=c.rep-6&&b.budget>p.value*0.9);
  if(!buyers.length)return; const b=pick(buyers);
  const fee=Math.round(p.value*rnd(0.85,p.listed?1.15:1.35)/1e5)*1e5;
  if(G.inbox.some(m=>m.offer&&!m.done&&m.pid===p.id))return;
  msg(`Oferta por ${p.name}`,`${b.name} ofrece ${fmtM(fee)} por ${p.name} (${p.pos}, ${p.ovr}). Valor de mercado: ${fmtM(p.value)}.`,{offer:true,pid:p.id,from:b.id,fee});
}
function acceptOfferIn(m){
  const p=G.players[m.pid],b=G.clubs[m.from],c=userClub();
  if(!windowOpen())return 'El mercado está cerrado.'; if(p.clubId!==c.id)return 'El jugador ya no está en tu club.';
  if(b.budget<m.fee)return `${b.name} ya no puede pagar esa cantidad.`;
  const top=c.squad.map(id=>G.players[id]).sort((a,b)=>b.ovr-a.ovr).slice(0,3).map(x=>x.id);
  if(top.includes(p.id))G.approval=clamp(G.approval-4,0,100);
  b.budget-=m.fee;c.balance+=m.fee;c.fin&&(c.fin.transfers+=m.fee);movePlayer(p,b.id,m.fee);m.done='aceptada';
  news(`${c.name} vende a ${p.name} a ${b.name} por ${fmtM(m.fee)}.`);return null;
}
function rejectOfferIn(m){m.done='rechazada';const p=G.players[m.pid],b=G.clubs[m.from],c=userClub();
  if(b.rep>c.rep+5&&p.pers.amb>70){p.morale=clamp(p.morale-15,5,100);msg(`${p.name} está molesto`,`${p.name} quería marcharse a ${b.name} y no le ha gustado que rechazaras la oferta.`)}}

// ---------- fichajes del usuario (presidente) ----------
function askingPrice(p){
  if(!p.clubId)return 0; const s=G.clubs[p.clubId]; const xi=bestXI(s).map(x=>x.pid);
  let k=1.15; if(xi.includes(p.id))k+=0.35; if(p.listed)k-=0.3; if(p.contract-G.season<=0)k-=0.25;
  return Math.round(p.value*k/1e5)*1e5;
}
function makeBid(p,fee){
  const c=userClub(); if(!windowOpen()&&p.clubId)return {ok:false,msg:'El mercado de fichajes está cerrado.'};
  if(p.clubId===c.id)return {ok:false,msg:'Ya es tu jugador.'};
  if(fee>c.balance)return {ok:false,msg:'No tienes saldo suficiente para esa oferta.'};
  if(!p.clubId)return {ok:true,status:'accept',fee:0};
  if(fee>=p.clause)return {ok:true,status:'accept',fee,clause:true};
  const ask=askingPrice(p);
  if(fee>=ask)return {ok:true,status:'accept',fee};
  if(fee>=ask*0.75)return {ok:true,status:'counter',counter:Math.round(((ask+fee)/2+ask*0.05)/1e5)*1e5};
  return {ok:true,status:'reject',msg:`${G.clubs[p.clubId].name} rechaza la oferta. Piden bastante más.`};
}
function wageDemand(p,toClub){
  const from=p.clubId?G.clubs[p.clubId]:null; let d=Math.max(wageFor(p.ovr),p.wage*1.12);
  if(from){const diff=from.rep-toClub.rep; d*=1+Math.max(0,diff)/35; if(diff>8&&p.pers.amb>75)return null;}
  return Math.round(d*(0.95+p.pers.amb/400)/1000)*1000;
}
function offerContract(p,wage,years,fee){
  const c=userClub(); const dem=wageDemand(p,c);
  if(dem===null)return {ok:false,msg:`${p.name} no quiere bajar de nivel: rechaza unirse a ${c.name}.`};
  if(wage<dem*0.97)return {ok:false,msg:`${p.name} pide al menos ${fmtM(dem)} al año.`,demand:dem};
  const wb=wageBudget(c),bill=wageBill(c);
  if(bill+wage>wb*1.05)return {ok:false,msg:`La junta bloquea el fichaje: superarías el límite salarial (${fmtM(wb)}/año).`};
  if(fee>c.balance)return {ok:false,msg:'No hay saldo suficiente.'};
  const seller=p.clubId?G.clubs[p.clubId]:null;
  c.balance-=fee; c.fin&&(c.fin.transfers-=fee); if(seller)seller.budget+=fee*0.8;
  const best=Math.max(...c.squad.map(id=>G.players[id].ovr));
  movePlayer(p,c.id,fee,wage,years);
  if(p.ovr>=best)G.approval=clamp(G.approval+4,0,100); else if(fee>20e6)G.approval=clamp(G.approval+1.5,0,100);
  news(`${c.name} ficha a ${p.name}${seller?' ('+seller.name+')':''} por ${fee?fmtM(fee):'nada (libre)'}.`);
  return {ok:true,msg:`¡${p.name} es nuevo jugador de ${c.name}!`};
}
function renewContract(p,wage,years){
  const c=userClub(); let dem=Math.round(Math.max(wageFor(p.ovr),p.wage*1.08)*(p.morale<40?1.3:1)/1000)*1000;
  if(p.morale<20)return {ok:false,msg:`${p.name} no quiere renovar. Su moral está por los suelos.`};
  if(wage<dem*0.97)return {ok:false,msg:`${p.name} pide ${fmtM(dem)} al año para renovar.`,demand:dem};
  if(wageBill(c)-p.wage+wage>wageBudget(c)*1.05)return {ok:false,msg:'La junta no aprueba ese salario: superaría el límite salarial.'};
  p.wage=wage;p.contract=G.season+years;p.morale=clamp(p.morale+8,5,100);p.value=valueOf(p);return {ok:true,msg:`${p.name} renueva hasta ${p.contract+1}.`};
}
function releasePlayer(p){const c=userClub();const yl=Math.max(1,p.contract-G.season);const cost=p.wage*yl*0.6;c.balance-=cost;c.fin&&(c.fin.wages-=cost);movePlayer(p,null);return cost}
function hireCoach(co){
  const c=userClub(),old=G.coaches[c.coachId];
  if(old){const comp=old.wage*Math.max(0.5,old.contract-G.season);c.balance-=comp;old.clubId=null;msg('Entrenador destituido',`${old.name} deja el banquillo. Indemnización: ${fmtM(comp)}.`)}
  co.clubId=c.id;co.contract=G.season+2;c.coachId=co.id; G.approval=clamp(G.approval+(co.q>(old?.q||0)+5?3:-1),0,100);
  news(`${c.name} anuncia a ${co.name} como nuevo entrenador.`);
}
function upgradeCost(c,k){return k==='stadium'?Math.round(c.cap*900/1e6)*1e6+25e6:Math.round(6e6*Math.pow(c.fac[k],1.6)/1e5)*1e5}
function upgrade(k){
  const c=userClub(),cost=upgradeCost(c,k); if(c.balance<cost)return 'Saldo insuficiente.';
  if(k==='stadium'){if(c.stadiumWork>0)return 'Ya hay obras en marcha.';c.stadiumWork=20;c.stadiumAdd=Math.round(c.cap*0.15/500)*500+3000;}
  else{if(c.fac[k]>=5)return 'Ya está al máximo.';c.fac[k]++;}

    const club=matchClub(r[C.club]||''); if(!club)continue;
    const ovr=+r[C.ovr]; if(!ovr)continue;
    const raw=(r[C.pos]||'').split(/[ ,]+/)[0].toUpperCase(); const pos=POS_MAP[raw]; if(!pos)continue;
    (byClub[club.id]=byClub[club.id]||[]).push({r,pos,ovr});
  }
  for(const [cid,list] of Object.entries(byClub)){
    if(list.length<14)continue; const c=G.clubs[cid];
    for(const id of c.squad)delete G.players[id]; c.squad=[];
    list.sort((a,b)=>b.ovr-a.ovr).slice(0,32).forEach(({r,pos,ovr})=>{
      const natName=C.nat>=0?r[C.nat]:''; const nat=NAT_EN[natName]||'XX';
      const p=makePlayer({pos,ovr,age:+r[C.age]||25,nat:nat==='XX'?'ES':nat,clubId:c.id});
      p.name=r[C.name]; p.nat=nat; if(nat==='XX'){p.natName=natName;p.flag=FLAG_EN[natName]||'🌍'}
      if(C.pac>=0&&r[C.pac]){for(const k of ['pac','sho','pas','dri','def','phy']){const v=+r[C[k]];if(v)p.a[k]=v}}
      if(pos==='POR'&&C.gk>=0&&+r[C.gk])p.a.gk=+r[C.gk];
      const cur=calcOvr(p),d=ovr-cur;for(const k in W[pos])p.a[k]=clamp(Math.round(p.a[k]+d),5,99);p.ovr=calcOvr(p);
      p.pot=Math.max(p.ovr,+r[C.pot]||p.pot);
      if(C.contract>=0&&+r[C.contract])p.contract=Math.max(G.season,+r[C.contract]-1);
      p.wage=C.wage>=0&&+r[C.wage]?Math.round(+r[C.wage]*52/1000)*1000:wageFor(p.ovr);
      p.value=valueOf(p); p.clause=Math.round(p.value*rnd(2.2,4.5)/1e5)*1e5;
      G.players[p.id]=p;c.squad.push(p.id);matched++;
    });
  }
  return {ok:true,msg:`Importados ${matched} jugadores en ${Object.keys(byClub).filter(k=>byClub[k].length>=14).length} clubes.`};
}
function flagOf(p){return p.flag||(NATS[p.nat]?NATS[p.nat].f:'🌍')}

function evText(e,res){
  const p=G.players[e.pid],n=p?esc(p.name):'Jugador';
  if(e.t==='goal')return `⚽ <b>${n}</b>${e.as&&G.players[e.as]?` <span class="mute">(asist. ${esc(G.players[e.as].name)})</span>`:''}`;
  if(e.t==='chance')return `${e.on?'🧤':'💨'} ${e.on?'Parada al disparo de':'Ocasión clara de'} ${n}`;
  if(e.t==='yellow')return `🟨 ${n}`; if(e.t==='red')return `🟥 ${n} (expulsado)`; if(e.t==='inj')return `✚ ${n} se lesiona`; return '';
}
function matchModal(res,animate){
  const H=G.clubs[res.h],A=G.clubs[res.a];
  openModal(`<div class="score" style="margin-top:28px"><div class="tm">${crest(H)}<span>${esc(H.name)}</span></div><div><div class="res" id="sc">0 – 0</div><div class="min" id="mn">0'</div></div><div class="tm">${crest(A)}<span>${esc(A.name)}</span></div></div>
   <div class="ticker" id="tk"></div><div id="mstats"></div><div class="btns" id="mbtn"><button class="btn" data-a="skipmatch">Ver resultado final</button></div>`);
  let m=0,hg=0,ag=0,shown=0;const tk=document.getElementById('tk');
  const step=()=>{m++;while(shown<res.ev.length&&res.ev[shown].m<=m){const e=res.ev[shown++];if(e.t==='goal'){e.s==='h'?hg++:ag++}
      tk.insertAdjacentHTML('afterbegin',`<div class="ev ${e.s} ${e.t}"><span class="m">${e.m}'</span><span>${evText(e,res)}</span></div>`)}
    const sc=document.getElementById('sc');if(!sc){clearInterval(UI.timer);return}sc.textContent=`${hg} – ${ag}`;document.getElementById('mn').textContent=m>=90?'Final':m+"'";
    if(m>=96){clearInterval(UI.timer);finishMatch(res)}};
  clearInterval(UI.timer);
  if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)UI.timer=setInterval(step,55);else{for(let i=0;i<96;i++)step()}
  UI.skip=()=>{clearInterval(UI.timer);while(m<96)step()};
}
function finishMatch(res){
  const st=res.st;const box=document.getElementById('mstats');if(!box)return;
  const cmp=(l,a,b,f=v=>v)=>{const t=a+b||1;return `<div class="cmp"><span class="t">${l}</span><span class="v">${f(a)}</span><div class="b"><i style="width:${a/t*100}%"></i><em style="width:${b/t*100}%"></em></div><span class="v">${f(b)}</span></div>`};
  const me=G.mode==='pres'?G.userClubId:userPlayer().clubId;const side=res.h===me?'h':'a';const xi=side==='h'?res.hx:res.ax;
  const rows=xi.map(x=>({p:G.players[x.pid],r:res.rat[x.pid]})).concat(res.sub&&res.sub.s===side?[{p:G.players[res.sub.pid],r:res.rat[res.sub.pid],sub:1}]:[]).filter(x=>x.p).sort((a,b)=>b.r-a.r);
  box.innerHTML=`<h3>Estadísticas</h3>${cmp('Posesión',res.poss,100-res.poss,v=>v+'%')}${cmp('Remates',st.h.sh,st.a.sh)}${cmp('A puerta',st.h.sot,st.a.sot)}${cmp('Goles esperados (xG)',+st.h.xg.toFixed(2),+st.a.xg.toFixed(2),v=>v.toFixed(2))}${cmp('Córners',st.h.co,st.a.co)}${cmp('Tarjetas',st.h.yc+st.h.rc,st.a.yc+st.a.rc)}
  <h3>Notas de tu equipo</h3><div class="list">${rows.map(x=>`<div class="it" ${x.p.isUser?'style="background:rgba(242,181,68,.12)"':''}>${posTag(x.p.pos)}<span class="grow nm">${esc(x.p.name)}${x.sub?' <span class="mute small">(sale del banquillo)</span>':''}</span><b class="num ${x.r>=7.5?'win':x.r<6?'red':''}">${x.r.toFixed(1)}</b></div>`).join('')}</div>`;
  document.getElementById('mbtn').innerHTML=`<button class="btn pri full" data-a="close">Continuar</button>`;
}

function momentsFlow(fx,role){
  const ms=makeMoments(role);let i=0;const forced=[];
  const show=()=>{
    if(i>=ms.length){closeModal();runWeek(forced,role==='sub'?{pid:G.userPlayerId,club:userPlayer().clubId}:null);return}
    const mo=ms[i];const H=G.clubs[fx.h],A=G.clubs[fx.a];
    openModal(`<div class="small mute" style="margin-top:6px">${esc(H.name)} – ${esc(A.name)} · ${role==='sub'?'Sales desde el banquillo':'Titular'}</div><h2>Minuto ${mo.m}'</h2><p class="moment">${esc(mo.t)}</p>
     <div id="mo">${mo.o.map((o,k)=>`<button class="btn full" style="margin:6px 0" data-a="mopt" data-x="${k}">${esc(o[0])} <span class="mute small">· ${ATTR_ES[o[1]]}</span></button>`).join('')}</div>`,true);
    UI.mopt=k=>{const r=resolveMoment(mo,k,fx);forced.push(r.f);document.getElementById('mo').innerHTML=`<div class="card ${r.ok?'win':'red'}" style="font-size:1.1rem">${esc(r.txt)}</div><button class="btn pri full" data-a="mnext">${i+1<ms.length?'Seguir jugando':'Ver el partido'}</button>`;UI.mnext=()=>{i++;show()}};
  };
  show();
}

// ---------- avance ----------
function doAdvance(){
  if(G.gameOver)return;
  if(G.mode==='player'&&G.phase==='season'){const fx=userFixture();if(fx){const r=userRole();
    if(r.role==='starter'||r.role==='sub')return momentsFlow(fx,r.role);
    if(r.role==='bench')toast('El entrenador no cuenta contigo esta jornada: te quedas en el banquillo.');
    if(r.role==='out')toast('No estás disponible para este partido.');}}
  runWeek(null,null);
}
function runWeek(forced,sub){
  const r=advance(forced,sub);G.inbox.forEach(m=>{});save();
  if(r.type==='pre'&&G.phase==='season')toast('¡Empieza la temporada!');
  render();
  if(r.userRes)matchModal(r.userRes,true);
  if(r.type==='end'){UI.pendingSummary=true;if(!r.userRes)summaryModal()}
  if(G.gameOver&&!r.userRes&&r.type!=='end')render();
}

// ---------- acciones ----------
const ACT={
  tab:x=>{UI.tab=x;render();scrollTo(0,0)},
  screen:x=>{UI.screen=x;render()},
  newlg:x=>{UI.newLg=x;render()},
  continue:()=>{if(load()){UI.screen='game';UI.tab='home';render()}},
  newgame:()=>{if(confirm('¿Empezar una partida nueva? Se borrará la actual.')){localStorage.removeItem(SAVE_KEY);G=null;UI.screen='start';render()}},
  pickclub:x=>{newWorld('pres');applyCSV();const L=LEAGUES_DATA.find(l=>l.id===UI.newLg);const name=L.clubs[+x][0];
    G.userClubId=Object.values(G.clubs).find(c=>c.name===name).id;const c=userClub();c.fin={tv:0,tickets:0,merch:0,sponsor:0,wages:0,ops:0,transfers:0,prizes:0,works:0};
    msg('Bienvenido, presidente',`Has sido elegido presidente de ${c.name}. Tienes ${fmtM(c.balance)} en caja. El mercado está abierto durante la pretemporada. Las próximas elecciones serán dentro de cuatro temporadas.`);
    UI.screen='game';UI.tab='home';save();render()},
  startplayer:()=>{const n=document.getElementById('pn').value.trim();if(!n)return toast('Escribe un nombre para tu jugador.');
    newWorld('player');applyCSV();createUserPlayer({name:n,nat:document.getElementById('pnat').value,pos:document.getElementById('ppos').value,leagueId:document.getElementById('plg').value});
    G.training.focus=document.getElementById('ppos').value==='POR'?'porteria':['DFC','LD','LI','MCD'].includes(document.getElementById('ppos').value)?'defensa':['DC'].includes(document.getElementById('ppos').value)?'tiro':'tecnica';
    UI.screen='game';UI.tab='home';save();render()},
  advance:()=>doAdvance(),
  menu:()=>openModal(`<h2>Partida</h2><div class="btns" style="flex-direction:column"><button class="btn" data-a="export">Exportar partida (.json)</button><button class="btn" data-a="tomenu">Volver al menú principal</button><button class="btn dan" data-a="newgame">Borrar y empezar de nuevo</button></div><p class="small mute" style="margin-top:12px">La partida se guarda automáticamente en este navegador al avanzar cada semana.</p>`),
  export:()=>{const b=new Blob([JSON.stringify(G)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`palco_${G.season}.json`;a.click()},
  tomenu:()=>{save();closeModal();UI.screen='start';render()},
  close:()=>{closeModal();if(UI.pendingSummary){UI.pendingSummary=false;render();summaryModal()}else render()},
  closesum:()=>{closeModal();render()},
  bgclose:(x,el,ev)=>{if(ev.target===el)ACT.close()},
  sq:x=>{UI.sq=x;render()},
  mk:(x,el)=>{const k=el.dataset.k;UI.mkt[k]=k==='free'?x==='true':['max','min'].includes(k)?+x:x;render()},
  player:x=>playerModal(+x),
  club:x=>{const c=G.clubs[+x];const ps=c.squad.map(id=>G.players[id]).sort((a,b)=>POSS.indexOf(a.pos)-POSS.indexOf(b.pos)||b.ovr-a.ovr);const co=G.coaches[c.coachId];
    openModal(`<div class="row" style="margin-top:4px">${crest(c)}<div><h2 style="margin:0">${esc(c.name)}</h2><div class="sub">${esc(leagueOf(c.id).name)} · ${c.cap.toLocaleString('es-ES')} espectadores · ${c.titles} liga(s) en tu partida</div></div></div>
    <p class="small mute" style="margin:10px 0">Entrenador: ${co?esc(co.name)+' ('+co.style+', '+co.q+')':'–'} · media del once ${Math.round(clubBase(c))}</p><div class="list">${ps.map(p=>playerRow(p,`${p.age} años · ${fmtM(p.value)}`)).join('')}</div>`)},
  lgv:x=>{UI.lg=x;render()},
  viewmatch:()=>G.lastMatch&&matchModal(G.lastMatch,false),
  summary:()=>summaryModal(),
  skipmatch:()=>UI.skip&&UI.skip(),
  neg:x=>negForm(x),
  sendbid:()=>{const p=G.players[UI.neg.pid];const fee=Math.round(+document.getElementById('nfee').value*1e6);const r=makeBid(p,fee);
    if(!r.ok)return toast(r.msg);
    if(r.status==='accept'){UI.neg.fee=fee;toast(`${G.clubs[p.clubId].name} acepta. Ahora negocia con el jugador.`);negForm('contract')}
    else if(r.status==='counter'){document.getElementById('nfee').value=(r.counter/1e6).toFixed(1);toast(`Contraoferta: piden ${fmtM(r.counter)}.`)}
    else toast(r.msg)},
  clause:x=>{const p=G.players[+x];if(!windowOpen())return toast('El mercado de fichajes está cerrado.');if(userClub().balance<p.clause)return toast('No tienes saldo para pagar la cláusula.');UI.neg={pid:p.id,fee:p.clause};negForm('contract')},
  sendcontract:()=>{const p=G.players[UI.neg.pid];const w=Math.round(+document.getElementById('nwage').value*1e6/1000)*1000,y=+document.getElementById('nyrs').value;
    const r=UI.neg.kind==='renew'?renewContract(p,w,y):offerContract(p,w,y,UI.neg.fee||0);
    if(r.demand)document.getElementById('nwage').value=(r.demand/1e6).toFixed(2);
    toast(r.msg);if(r.ok){save();closeModal();render()}},
  list:x=>{const p=G.players[+x];p.listed=!p.listed;save();playerModal(p.id,p.listed?'Jugador en la lista de transferibles. Recibirás más ofertas por él.':null)},
  release:x=>{const p=G.players[+x];const yl=Math.max(1,p.contract-G.season);if(confirm(`¿Rescindir a ${p.name}? Le pagarás unos ${fmtM(p.wage*yl*0.6)} de indemnización.`)){const c=releasePlayer(p);toast(`${p.name} queda libre. Coste: ${fmtM(c)}.`);save();closeModal();render()}},
  offacc:x=>{const m=G.inbox.find(m=>m.id===+x);const e=acceptOfferIn(m);if(e)toast(e);else toast('Traspaso cerrado.');save();render()},
  offrej:x=>{const m=G.inbox.find(m=>m.id===+x);rejectOfferIn(m);save();render()},
  coaches:()=>{const fr=Object.values(G.coaches).filter(c=>!c.clubId).sort((a,b)=>b.q-a.q);
    openModal(`<h2>Entrenadores libres</h2><p class="small mute">Despedir al actual cuesta su salario pendiente. La calidad y el estilo afectan al rendimiento del equipo.</p><div class="list">${fr.map(c=>`<div class="it"><span class="ovr ${ovrCls(c.q)}">${c.q}</span><div class="grow"><div class="nm">${NATS[c.nat]?.f||''} ${esc(c.name)}</div><div class="sub">${c.style} · ${c.age} años · ${fmtM(c.wage)}/año</div></div><button class="btn" data-a="hire" data-x="${c.id}">Contratar</button></div>`).join('')}</div>`)},
  hire:x=>{const co=G.coaches[+x];if(confirm(`¿Contratar a ${co.name} y destituir al entrenador actual?`)){hireCoach(co);save();closeModal();render();toast(`${co.name} es tu nuevo entrenador.`)}},
  ticket:x=>{const c=userClub();c.ticket=clamp(c.ticket+ +x,5,250);save();render()},
  sponsor:x=>{const c=userClub(),o=sponsorOffers(c)[+x];c.sponsor={name:o.name,annual:o.annual,until:G.season+o.years-1};news(`${c.name} firma con ${o.name} como patrocinador principal.`);save();render()},
  upg:x=>{const e=upgrade(x);if(e)toast(e);else toast('Obra aprobada.');save();render()},
  trf:x=>{G.training.focus=x;save();render()}, tri:x=>{G.training.intensity=+x;save();render()},
  renewme:()=>{toast(requestRenewal());save();render()},
  leave:()=>{toast(requestTransfer());save();render()},
  pacc:x=>{const o=G.playerOffers[+x];if(!windowOpen())return toast('El mercado está cerrado.');if(confirm(`¿Fichar por ${G.clubs[o.club].name}?`)){acceptPlayerOffer(o);save();render();toast(`¡Nuevo jugador de ${G.clubs[o.club].name}!`)}},
  retire:()=>{if(confirm('¿Seguro que quieres retirarte?')){G.gameOver={reason:`Te retiras a los ${userPlayer().age} años.`,career:true};save();render()}},
  mopt:x=>UI.mopt(+x), mnext:()=>UI.mnext()
};
function applyCSV(){if(UI.csv){const r=importCSV(UI.csv);setTimeout(()=>toast(r.msg),300);if(r.ok)for(const lg of G.leagues)newSeasonLeague(lg)}}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f){if(el.dataset.a!=='bgclose')ev.stopPropagation();f(el.dataset.x,el,ev)}});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.dataset.c==='csv'&&el.files[0]){const r=new FileReader();r.onload=()=>{UI.csv=r.result;toast('CSV cargado. Se aplicará al crear la partida.');render()};r.readAsText(el.files[0])}
  if(el.dataset.c==='loadjson'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{G=JSON.parse(r.result);save();UI.screen='game';UI.tab='home';render()}catch(e){toast('Ese archivo no es una partida válida.')}};r.readAsText(el.files[0])}
});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.c==='mq'){UI.mkt.q=el.value;clearTimeout(UI.qt);UI.qt=setTimeout(()=>{render();const i=document.querySelector('[data-c=mq]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},350)}});
render();
</script></body></html>
