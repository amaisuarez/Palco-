<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1A2C"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Palco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECF1;--panel:#FFFFFF;--panel2:#F1F4F7;--line:#D3DAE3;--ink:#0F1A2C;--mute:#5A687D;
 --grass:#1C7A46;--red:#C4372B;--amber:#A86F06;--win:#1C7A46;--draw:#8A93A3;
 --ucl:#1B2A8A;--uel:#D2550C;--uecl:#0E8F49;--nat:#8A1D42;
 --gk:#D9A300;--df:#2C6AD1;--mf:#179652;--fw:#D23D2C;
 --fd:'Big Shoulders Display','Arial Narrow',sans-serif;--fb:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
 --r1:4px;--r2:10px;--r3:20px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B111D;--panel:#131B2B;--panel2:#1A2436;--line:#27324A;--ink:#E9EDF4;--mute:#8F9BB1;
 --grass:#3DBA72;--red:#F06B5D;--amber:#E7B24A;--win:#3DBA72;--draw:#8F9BB1;--ucl:#8E9CFF;--uel:#FF8C47;--uecl:#40D080;--nat:#EE7FA2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B111D;--panel:#131B2B;--panel2:#1A2436;--line:#27324A;--ink:#E9EDF4;--mute:#8F9BB1;
 --grass:#3DBA72;--red:#F06B5D;--amber:#E7B24A;--win:#3DBA72;--draw:#8F9BB1;--ucl:#8E9CFF;--uel:#FF8C47;--uecl:#40D080;--nat:#EE7FA2;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);padding:10px 12px;width:100%}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:150px}
h1,h2,h3,.num{font-family:var(--fd);letter-spacing:.005em;font-variant-numeric:tabular-nums}
h2{font-size:2rem;font-weight:800;line-height:1;margin:26px 0 12px}
h3{font-size:1.3rem;font-weight:700;line-height:1.1;margin:24px 0 8px}
.mute{color:var(--mute)}.small{font-size:.85rem}.amber{color:var(--amber)}.red{color:var(--red)}.win{color:var(--win)}
.wrap{padding:0 16px}
/* cabecera con bufanda del club */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.scarf{height:8px;background:repeating-linear-gradient(90deg,var(--c1,#0F1A2C) 0 16px,var(--c2,#fff) 16px 32px);box-shadow:inset 0 -1px rgba(0,0,0,.18)}
.top .bar{display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .ttl{flex:1;min-width:0}.top .ttl b{font-family:var(--fd);font-weight:800;font-size:1.45rem;line-height:1.05;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:.8rem;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{flex:none;display:block}
.kpi{text-align:right;font-family:var(--fd);font-weight:800;font-size:1.25rem;line-height:1.05}.kpi small{display:block;font-family:var(--fb);font-weight:500;font-size:.74rem;color:var(--mute)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:1.05rem;flex:none}
/* navegación */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0)}
nav.tabs .in{display:flex;width:100%;max-width:600px}
nav.tabs button{flex:1;padding:8px 2px 9px;font-size:.72rem;font-weight:500;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:3px;background:var(--ink);border-radius:0 0 3px 3px}
.badge{position:absolute;top:3px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:.65rem;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px}
.go{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0));z-index:6;display:flex;justify-content:center;pointer-events:none}
.go button{pointer-events:auto;width:min(568px,calc(100% - 32px));background:var(--ink);color:var(--panel);font-family:var(--fd);font-weight:800;font-size:1.3rem;padding:12px 16px;border-radius:var(--r2);box-shadow:0 8px 24px rgba(10,20,40,.28);display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.go button small{font-family:var(--fb);font-weight:500;font-size:.78rem;opacity:.75;white-space:nowrap}
.go button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* bloques */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px;margin:10px 0}
.card.flat{background:transparent}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.list>.it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.list>.it:last-child{border-bottom:0}
.it.tap{cursor:pointer}.it.tap:active,.it.tap:hover{background:var(--panel2)}
.ovr{font-family:var(--fd);font-weight:800;font-size:1.2rem;min-width:38px;height:30px;padding:0 4px;border-radius:var(--r1);display:grid;place-items:center;flex:none;background:var(--panel2);color:var(--ink);font-variant-numeric:tabular-nums}
.ovr.g1{background:var(--grass);color:#fff}.ovr.g2{background:var(--ink);color:var(--panel)}.ovr.g3{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}.ovr.g4{background:var(--panel2);color:var(--mute)}
.pos{display:inline-flex;align-items:center;gap:5px;font-family:var(--fd);font-weight:700;font-size:.95rem;width:50px;flex:none}
.pos i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:inset 0 -2px rgba(0,0,0,.25),0 1px 1px rgba(0,0,0,.2)}
.pos.GK{--c:var(--gk)}.pos.DF{--c:var(--df)}.pos.MF{--c:var(--mf)}.pos.FW{--c:var(--fw)}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sub{font-size:.8rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r1);background:var(--panel);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.dan{border-color:var(--red);color:var(--red)}
.btn.full{width:100%}.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns .btn{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.85rem;color:var(--mute);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--k)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--ink);white-space:nowrap}
.tag.UCL{background:var(--ucl);color:var(--panel)}.tag.UEL{background:var(--uel);color:var(--panel)}.tag.UECL{background:var(--uecl);color:var(--panel)}.tag.NAT{background:var(--nat);color:var(--panel)}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--win)}
.fitb{display:inline-block;width:34px;height:5px;border-radius:3px;background:var(--panel2);vertical-align:middle;overflow:hidden;margin-left:4px}.fitb i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px}.stat b{font-family:var(--fd);font-weight:800;font-size:1.6rem;display:block;line-height:1.05}.stat span{font-size:.78rem;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
td,th{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}th{color:var(--mute);font-weight:500;font-size:.75rem}
td.l,th.l{text-align:left}tr.me td{background:color-mix(in srgb,var(--amber) 16%,transparent)}
tr.z1 td:first-child{box-shadow:inset 4px 0 var(--ucl)}tr.z2 td:first-child{box-shadow:inset 4px 0 var(--uel)}tr.z3 td:first-child{box-shadow:inset 4px 0 var(--uecl)}tr.z4 td:first-child{box-shadow:inset 4px 0 var(--red)}tr.z5 td:first-child{box-shadow:inset 4px 0 var(--amber)}
tr.cut td{border-bottom:2px solid var(--ink)}
.form{display:inline-flex;gap:3px}.form i{width:8px;height:8px;border-radius:50%;display:inline-block}.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 2px 2px;font-size:.78rem;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--k)}
/* competición: cabecera */
.comphead{border-radius:var(--r2);padding:16px;margin:14px 0 10px;color:var(--panel);background:var(--k);position:relative;overflow:hidden}
.comphead h2{margin:0}.comphead p{font-size:.85rem;opacity:.85;margin-top:4px}
.comphead::after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:14px solid currentColor;opacity:.13}
.tie{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:.9rem;align-items:center}
.tie:last-child{border-bottom:0}.tie .w{font-weight:700}.tie .sc{font-family:var(--fd);font-weight:700;font-size:1.05rem;text-align:right;font-variant-numeric:tabular-nums}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,14,26,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:var(--r3) var(--r3) 0 0;padding:18px 16px 28px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .close{float:right}
/* marcador de retransmisión */
.bug{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:#0F1A2C;color:#fff;border-radius:var(--r2);overflow:hidden;margin-top:30px;border:1px solid var(--line)}
.bug .bt{display:flex;align-items:center;gap:10px;padding:14px 12px;min-width:0;font-weight:600;font-size:.92rem;border-left:6px solid var(--c)}
.bug .bt.a{flex-direction:row-reverse;text-align:right;border-left:0;border-right:6px solid var(--c)}
.bug .bt span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.15}
.bug .bs{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 14px;background:rgba(255,255,255,.07)}
.bug .bs b{font-family:var(--fd);font-weight:900;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.bug .bs span{font-family:var(--fd);font-weight:700;font-size:1rem;color:#F4C04E}
.bugsub{text-align:center;font-size:.8rem;color:var(--mute);margin-top:8px}
.ticker{margin-top:10px;max-height:280px;overflow-y:auto}
.ev{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:.9rem}.ev .m{font-family:var(--fd);font-weight:700;color:var(--mute);width:32px;flex:none;text-align:right}
.ev.a{flex-direction:row-reverse;text-align:right}.ev.a .m{text-align:left}
.ev.goal{font-weight:700}
.cmp{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-size:.85rem;margin:8px 0}
.cmp .t{text-align:center;color:var(--mute);font-size:.75rem;grid-column:1/4;margin-bottom:-6px}
.cmp .b{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--panel2)}.cmp .b i{background:var(--hc,var(--ink))}.cmp .b em{background:var(--ac,var(--amber));margin-left:auto}
.cmp .v{font-family:var(--fd);font-weight:700;font-size:1.1rem}.cmp .v:last-child{text-align:right}
/* portada */
.hero{padding:0 0 10px}
.hero .scarf{height:22px}
.hero h1{font-size:clamp(4.4rem,22vw,8rem);font-weight:900;line-height:.85;letter-spacing:-.02em;padding:34px 16px 0}
.hero p{color:var(--mute);margin:14px 16px 0;max-width:40ch;font-size:1.02rem}
.pick{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin:10px 0}
.pick b{font-family:var(--fd);font-weight:800;font-size:1.55rem;display:block;line-height:1.05}.pick span{color:var(--mute);font-size:.9rem}
.pick .ic{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--panel2)}
.pick .ic svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.msg{padding:12px 4px;border-bottom:1px solid var(--line)}.msg:last-child{border-bottom:0}.msg.unread b::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:7px;vertical-align:1px}
.msg p{font-size:.9rem;color:var(--mute);margin-top:3px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:var(--r2);z-index:40;font-weight:600;max-width:90%;text-align:center}
.attr{display:grid;grid-template-columns:76px 30px 1fr;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}
.attr b{font-family:var(--fd);font-weight:800;font-size:1.05rem;text-align:right}
.moment{font-size:1.2rem;line-height:1.4;margin:14px 0 6px}
label.f{display:block;margin:12px 0 4px;font-size:.85rem;color:var(--mute)}
.step{display:flex;align-items:center;gap:10px}.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:1.2rem}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px}
.fx .t{display:flex;align-items:center;gap:10px;min-width:0}.fx .t.a{flex-direction:row-reverse;text-align:right}
.fx .vs{font-family:var(--fd);font-weight:800;font-size:1.1rem;color:var(--mute)}
.fx .vs.sc{font-size:1.9rem;color:var(--ink)}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:5px 0;font-size:.88rem}
.res .r{text-align:right}.res b{font-family:var(--fd);font-weight:700;font-size:1.05rem;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.grp{margin:10px 0}.grp table{font-size:.85rem}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
/* escritorio: carril lateral */
@media (min-width:980px){
 #app{max-width:none;padding:0 0 110px 236px}
 .top{padding-left:0}.top .bar,main.wrap{max-width:760px;margin:0 auto}
 main.wrap{padding:0 24px}
 nav.tabs{top:0;bottom:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);flex-direction:column;justify-content:flex-start;padding:22px 12px}
 nav.tabs::before{content:'Palco';font-family:var(--fd);font-weight:900;font-size:2.4rem;line-height:1;padding:0 12px 18px}
 nav.tabs .in{flex-direction:column;gap:2px}
 nav.tabs button{flex:none;flex-direction:row;gap:12px;font-size:.95rem;padding:10px 12px;border-radius:var(--r1);justify-content:flex-start}
 nav.tabs button.on{background:var(--panel2)}
 nav.tabs button.on::before{top:8px;bottom:8px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
 .badge{position:static;margin-left:auto}
 .go{left:236px;bottom:22px}.go button{width:min(712px,calc(100% - 48px))}
 .modal{align-items:center}.sheet{border-radius:var(--r3);max-height:86vh}
 .toast{bottom:100px}
}
</style></head>

const poisson=l=>{let L=Math.exp(-l),k=0,p=1;do{k++;p*=R()}while(p>L);return k-1};

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function buildCalendar(season){

    const d=st.getTime()+w*7*DAY;
    if(w===41){out.push({k:'E',md:17,d});continue}
    if(I.has(w))out.push({k:'I',d:d-DAY*2}); else out.push({k:'L',r:r++,d});

function bestXI(club,comp='L'){
  const pool=club.squad.map(id=>G.players[id]).filter(p=>available(p,comp));
  const used=new Set(), xi=[];

function teamStrength(club,xi){

        const conv=xg*clamp(1+(p.a.sho-gkv)/110,0.65,1.35);

        } else {
          const on=R()<0.38; if(on){st[s].sot++; if(gk)rat[gk.pid]+=0.12;}
          if(xg>0.25) ev.push({m,t:'chance',s,pid:sh.pid,xg,on});

function penalties(res){

function euroQualify(first){
  const q={UCL:[],UEL:[],UECL:[]},taken=new Set();
  const add=(k,id)=>{if(id!=null&&!taken.has(id)&&q[k].length<36){q[k].push(id);taken.add(id)}};
  if(!first&&G.euro){add('UCL',G.euro.UCL.champ);add('UCL',G.euro.UEL.champ);add('UEL',G.euro.UECL.champ)}
  for(const lg of G.leagues){
    const order=first?[...lg.clubIds].sort((a,b)=>G.clubs[b].rep-G.clubs[a].rep):standings(lg).map(t=>t.id);
    const [a,b,c]=EURO_SLOTS[lg.id];let i=0;const nx=()=>{while(i<order.length&&taken.has(order[i]))i++;return order[i++]};
    for(let k=0;k<a;k++)add('UCL',nx());for(let k=0;k<b;k++)add('UEL',nx());for(let k=0;k<c;k++)add('UECL',nx());
  }
  const others=G.otherIds.filter(id=>!taken.has(id)).map(id=>({id,s:G.clubs[id].rep+gauss(0,2.5)})).sort((a,b)=>b.s-a.s).map(x=>x.id);
  for(const k of ['UCL','UEL','UECL'])while(q[k].length<36&&others.length)add(k,others.shift());

}
function drawSwiss(ids){
  const n=ids.length;let best=null,bs=1e9;
  for(let t=0;t<150&&bs>0;t++){
    const a=shuffle(ids),rr=[];
    for(let r=0;r<n-1;r++){const rd=[];for(let i=0;i<n/2;i++)rd.push([a[i],a[n-1-i]]);rr.push(rd);a.splice(1,0,a.pop())}
    const p8=shuffle(rr).slice(0,8);let cl=0;for(const rd of p8)for(const [x,y] of rd)if(G.clubs[x].nat===G.clubs[y].nat)cl++;
    if(cl<bs){bs=cl;best=p8}
  }
  const rounds=best.map(rd=>rd.map(p=>R()<0.5?[p[0],p[1]]:[p[1],p[0]]));
  const home={};ids.forEach(i=>home[i]=0);rounds.flat().forEach(([h])=>home[h]++);
  for(let it=0;it<3000;it++){const x=ids.find(i=>home[i]>4);if(x==null)break;
    const cands=[];rounds.forEach(rd=>rd.forEach((m,j)=>{if(m[0]===x)cands.push([rd,j])}));
    const ok=shuffle(cands).find(([rd,j])=>home[rd[j][1]]<4);const [rd,j]=ok||pick(cands);const y=rd[j][1];rd[j]=[y,x];home[x]--;home[y]++;
  }

}

}

function koKey(md){return md<=8?null:md<=10?'po':md<=12?'r16':md<=14?'qf':md<=16?'sf':'f'}

    const l=elig.filter(k=>(NATS[k].conf==='UEFA')===eu).map(k=>({k,s:G.nations[k].elo+gauss(0,90)})).sort((a,b)=>b.s-a.s).map(x=>x.k);

  A.elo+=d;B.elo-=d;A.form=(A.form||[]).concat(w===1?'W':w===0?'L':'D').slice(-5);B.form=(B.form||[]).concat(w===0?'W':w===1?'L':'D').slice(-5);

function finishTour(t){

function msg(title,body,extra={}){G.inbox.unshift({id:G.msgSeq++,title,body,week:dateLabel(),read:false,...extra});G.inbox=G.inbox.slice(0,80)}

function advance(forced,subInfo){
  if(G.gameOver)return;
  resetNT();
  for(const c of Object.values(G.clubs))c._base=clubBase(c);
  if(G.phase==='tour'){
    recover(4);const uf=userFixture();
    if(!uf){while(G.phase==='tour')tourOne();return {type:'tourEnd'}}
    const r=tourOne(forced,subInfo,uf);if(r){r.label=uf.label;r.me=uf.me;r.kind='T';G.lastMatch={...r}}
    return {type:G.phase==='tour'?'match':'tourEnd',userRes:r};
  }
  if(G.phase==='pre'){
    recover(7);aiTransferRound(); aiTransferRound(); offersToUser(); weeklyFinance(7,false,false); weeklyPlayerMode(7,null);
    G.pre++; if(G.pre>=4){G.phase='season';G.slot=0;G.week=1;startSeasonHooks();}
    expireOffers(); return {type:'pre'};
  }
  const s=curSlot(),prev=G.cal[G.slot-1];const days=prev?Math.max(1,Math.round((s.d-prev.d)/DAY)):7;recover(days);
  const uf=userFixture();let userRes=null;
  if(s.k==='L'){
    const serving=Object.values(G.players).filter(p=>p.susp>0);
    for(const lg of G.leagues){const rd=lg.fixtures[s.r];if(!rd)continue;
      for(const [h,a] of rd){const isU=uf&&uf.kind==='L'&&uf.h===h&&uf.a===a;
        const res=simMatch(h,a,isU?{forced,subPid:subInfo&&subInfo.pid,subSide:subInfo&&(h===subInfo.club?'h':'a')}:{});
        applyMatch(lg,res);lg.results[s.r].push({h,a,hg:res.hg,ag:res.ag});if(isU)userRes=res}}
    serving.forEach(p=>{if(p.susp>0)p.susp--});G.lastRound=s.r;
  } else if(s.k==='E') userRes=euroSlot(s.md,forced,subInfo,uf);
  else if(s.k==='I') userRes=intlBreak(forced,subInfo,uf);
  if(userRes){userRes.label=uf.label;userRes.me=uf.me;userRes.kind=uf.kind;G.lastMatch={...userRes};afterUserMatch(userRes,uf)}
  const wasOpen=windowOpen();
  if(wasOpen){aiTransferRound();offersToUser();}
  weeklyFinance(days,!!(userRes&&G.mode==='pres'&&userRes.h===G.userClubId&&!userRes.neutral),uf&&uf.kind==='E');
  weeklyPlayerMode(days,userRes);
  if(G.slot%14===13)weeklyDevelopment();
  G.slot++;
  const nl=G.cal.slice(G.slot).find(x=>x.k==='L');if(nl)G.week=nl.r+1;
  if(G.slot<G.cal.length){const nowOpen=windowOpen();
    if(!wasOpen&&nowOpen)msg('Mercado de invierno abierto','La ventana de fichajes de enero está abierta hasta el 2 de febrero.');
    if(wasOpen&&!nowOpen){expireOffers(true);msg('Mercado cerrado','Se cierra el mercado de invierno. No habrá más traspasos hasta el verano.')}}
  if(G.mode==='pres'&&G.approval<10&&!G.gameOver){G.gameOver={reason:'Los socios han aprobado una moción de censura. Has sido destituido como presidente.'};}
  if(G.slot>=G.cal.length) return {type:'end',summary:endSeason(),userRes};
  return {type:'match',userRes};
}

// ---------- finanzas (presidente) ----------
function seasonIncome(c){
  const lg=leagueOf(c.id); const n=lg.clubIds.length;
  const tv=0.7*lg.tv/n*(0.55+0.9*Math.pow(c.rep/100,2));
  const merch=Math.pow(c.rep/100,6)*200e6;
  return {tv,merch,sponsor:c.sponsor&&c.sponsor.until>=G.season?c.sponsor.annual:sponsorValue(c.rep)*0.3};
}
function wageBill(c){return c.squad.reduce((s,id)=>s+G.players[id].wage,0)+(G.coaches[c.coachId]?.wage||0)}
function fairPrice(c){return Math.round(12+c.rep*0.4)}
function attendance(c,euro){
  const t=leagueOf(c.id).table[c.id]; const pts=t.p?t.pts/t.p:1.4;
  let d=0.55+c.rep/220+(G.approval-50)/250+(pts-1.4)/8-(c.ticket-fairPrice(c))/fairPrice(c)*0.7+(euro?0.12:0);
  return Math.round(c.cap*clamp(d,0.25,1));
}
function wageBudget(c){const i=seasonIncome(c);return Math.round((i.tv+i.merch+i.sponsor+c.cap*fairPrice(c)*17)*0.82)}
function finBlank(){return {tv:0,tickets:0,merch:0,sponsor:0,uefa:0,wages:0,ops:0,transfers:0,prizes:0,works:0}}
function weeklyFinance(days,homeMatch,euro){
  if(G.mode!=='pres')return; const c=userClub(); const k=days/301;
  const inc=seasonIncome(c); let delta=0; const f=c.fin||(c.fin=finBlank());
  const add=(key,v)=>{f[key]=(f[key]||0)+v;delta+=v};
  add('tv',inc.tv*k);add('merch',inc.merch*k);add('sponsor',inc.sponsor*k);
  if(homeMatch){const at=attendance(c,euro);c.lastAtt=at;add('tickets',at*c.ticket*(euro?1.4:1));}
  add('wages',-wageBill(c)*k); add('ops',-(c.cap*300+c.rep*c.rep*3000+c.fac.train*1.5e6+c.fac.youth*1.2e6)*k);
  c.balance+=delta;
  if(c.ticket>fairPrice(c)*1.3)G.approval=clamp(G.approval-0.25,0,100);
  if(c.balance<-50e6)G.approval=clamp(G.approval-0.3,0,100);
  if(c.stadiumWork>0){c.stadiumWork=Math.max(0,c.stadiumWork-days/7); if(c.stadiumWork===0){c.cap+=c.stadiumAdd;msg('Obras terminadas',`La ampliación del estadio ha terminado. Nuevo aforo: ${c.cap.toLocaleString('es-ES')} espectadores.`)}}
}
function afterUserMatch(res,uf){
  if(G.mode!=='pres'||uf.kind==='I')return; const me=res.h===G.userClubId?'h':'a'; const gf=me==='h'?res.hg:res.ag, ga=me==='h'?res.ag:res.hg;
  const c=userClub(); const opp=G.clubs[me==='h'?res.a:res.h]; const diff=(opp.rep-c.rep)/20;const k=uf.kind==='E'?1.25:1;
  G.approval=clamp(G.approval+k*(gf>ga?0.9+diff*0.5:gf<ga?-1.1+diff*0.5:diff*0.4),0,100);
}

// ---------- desarrollo ----------
function weeklyDevelopment(){
  for(const p of Object.values(G.players)){
    if(G.mode==='player'&&p.id===G.userPlayerId)continue;
    if(p.age<=22&&p.ovr<p.pot&&R()<0.35){growAttr(p,1);p.value=valueOf(p)}
  }
}
function growAttr(p,amt,focusKeys){
  const keys=focusKeys||Object.keys(W[p.pos]); const k=wpick(keys,k=>(W[p.pos][k]||0.08)+0.05);
  p.a[k]=clamp(p.a[k]+amt,5,99); const o=p.ovr; p.ovr=calcOvr(p); if(p.ovr>p.pot&&amt>0&&!focusKeys){p.a[k]-=amt;p.ovr=o}
}
function seasonDevelopment(p,minutesShare){
  let d;const gap=p.pot-p.ovr,c=G.clubs[p.clubId];const tf=c?0.85+c.fac.train*0.06:0.8;const mp=0.7+minutesShare*0.6;
  if(p.age<=20)d=gap*rnd(0.2,0.45)*tf*mp; else if(p.age<=23)d=gap*rnd(0.15,0.35)*tf*mp; else if(p.age<=27)d=rnd(-0.5,1.5);
  else if(p.age<=30)d=rnd(-1.5,0.8); else if(p.age<=32)d=rnd(-3,0); else d=rnd(-5,-1);
  d=Math.round(d); if(!d)return;
  const keys=Object.keys(W[p.pos]); for(let i=0;i<Math.abs(d)*3;i++){growAttr(p,Math.sign(d),d>0?null:keys.concat(['pac','phy']));}
  if(d<0){p.a.pac=clamp(p.a.pac-rint(0,2),5,99);p.ovr=calcOvr(p)}
}

// ---------- mercado IA ----------
function groupCount(c){const g={GK:0,DF:0,MF:0,FW:0};for(const id of c.squad)g[GROUP[G.players[id].pos]]++;return g}
function movePlayer(p,toId,fee,wage,years){
  const from=p.clubId?G.clubs[p.clubId]:null;
  if(from){from.squad=from.squad.filter(i=>i!==p.id);}
  if(toId){G.clubs[toId].squad.push(p.id);}
  p.clubId=toId||null; p.listed=false; p.yel=0;
  if(toId){p.wage=wage||Math.max(p.wage,wageFor(p.ovr));p.contract=G.season+(years||rint(2,5));p.clause=Math.round(valueOf(p)*rnd(2.2,4.5)/1e5)*1e5;p.morale=clamp(p.morale+10,5,100)}
  p.value=valueOf(p);
}
function aiClubs(){return Object.values(G.clubs).filter(c=>!(G.mode==='pres'&&c.id===G.userClubId))}
function aiTransferRound(){
  const all=Object.values(G.players);
  for(const c of aiClubs()){
    if(R()>(c.squad.length<23?1:0.3))continue;
    const g=groupCount(c); let need=Object.keys(MIN_GROUP).find(k=>g[k]<MIN_GROUP[k]);
    const base=c._base||clubBase(c);
    let minO, maxO;
    if(need){minO=base-8;maxO=base+3}
    else { if(R()>0.45)continue;
      const xi=bestXI(c); const weak=xi.slice().sort((a,b)=>a.eff-b.eff)[0]; if(!weak)continue;
      need=GROUP[weak.slot]; minO=weak.eff+2; maxO=weak.eff+9; if(c.squad.length>=30)continue; }
    let best=null,bs=-1;
    for(let i=0;i<260;i++){
      const p=all[Math.floor(R()*all.length)];
      if(!p||p.clubId===c.id||GROUP[p.pos]!==need||p.ovr<minO||p.ovr>maxO||p.age>31)continue;
      if(G.mode==='player'&&p.id===G.userPlayerId)continue;
      const seller=p.clubId?G.clubs[p.clubId]:null;
      if(seller&&seller.rep>c.rep+4)continue;
      const fee=seller?Math.round(p.value*rnd(1,1.35)/1e5)*1e5:0;
      if(fee>c.budget)continue;
      if(seller&&G.mode==='pres'&&seller.id===G.userClubId)continue;
      if(seller){const sg=groupCount(seller); if(sg[need]<=MIN_GROUP[need])continue;}
      const sc=p.ovr+(p.pot-p.ovr)*0.3-fee/2e7+(seller?0:3);
      if(sc>bs){bs=sc;best={p,fee,seller}}
    }
    if(best){
      const {p,fee,seller}=best; c.budget-=fee; if(seller)seller.budget+=fee*0.75;
      const fromName=seller?seller.name:'libre';
      movePlayer(p,c.id,fee,Math.round(Math.max(p.wage*1.1,wageFor(p.ovr))/1000)*1000);
      if(fee>=15e6||(G.mode==='player'&&seller&&seller.id===userPlayer()?.clubId))
        news(`${c.name} ficha a ${p.name} (${fromName}) por ${fmtM(fee)}.`);
      if(G.mode==='player'&&seller&&seller.id===userPlayer().clubId) msg('Movimiento en el vestuario',`${p.name} deja el club rumbo a ${c.name}.`);
    }
    if(c.squad.length>30){const worst=c.squad.map(id=>G.players[id]).filter(p=>!(G.mode==='player'&&p.id===G.userPlayerId)).sort((a,b)=>a.ovr-b.ovr)[0];if(worst)movePlayer(worst,null)}
  }
}
function offersToUser(){
  if(G.mode!=='pres'||R()>0.4)return; const c=userClub();
  const cands=c.squad.map(id=>G.players[id]).filter(p=>p.value>1.5e6);
  if(!cands.length)return; const p=wpick(cands,p=>p.ovr**3*(p.listed?4:1));
  const buyers=Object.values(G.clubs).filter(b=>b.id!==c.id&&b.rep>=c.rep-6&&b.budget>p.value*0.9);
  if(!buyers.length)return; const b=pick(buyers);
  const fee=Math.round(p.value*rnd(0.85,p.listed?1.15:1.35)/1e5)*1e5;
  if(G.inbox.some(m=>m.offer&&!m.done&&m.pid===p.id))return;
  msg(`Oferta por ${p.name}`,`${b.name} (${compName(b)}) ofrece ${fmtM(fee)} por ${p.name} (${p.pos}, ${p.ovr}). Valor de mercado: ${fmtM(p.value)}.`,{offer:true,pid:p.id,from:b.id,fee});
}
function acceptOfferIn(m){
  const p=G.players[m.pid],b=G.clubs[m.from],c=userClub();
  if(!windowOpen())return 'El mercado está cerrado.'; if(p.clubId!==c.id)return 'El jugador ya no está en tu club.';
  if(b.budget<m.fee)return `${b.name} ya no puede pagar esa cantidad.`;
  const top=c.squad.map(id=>G.players[id]).sort((a,b)=>b.ovr-a.ovr).slice(0,3).map(x=>x.id);
  if(top.includes(p.id))G.approval=clamp(G.approval-4,0,100);

}
function rejectOfferIn(m){m.done='rechazada';const p=G.players[m.pid],b=G.clubs[m.from],c=userClub();
  if(b.rep>c.rep+5&&p.pers.amb>70){p.morale=clamp(p.morale-15,5,100);msg(`${p.name} está molesto`,`${p.name} quería marcharse a ${b.name} y no le ha gustado que rechazaras la oferta.`)}}

// ---------- fichajes del usuario (presidente) ----------
function askingPrice(p){
  if(!p.clubId)return 0; const s=G.clubs[p.clubId]; const xi=bestXI(s).map(x=>x.pid);
  let k=1.15; if(xi.includes(p.id))k+=0.35; if(p.listed)k-=0.3; if(p.contract-G.season<=0)k-=0.25;
  return Math.round(p.value*k/1e5)*1e5;
}
function makeBid(p,fee){
  const c=userClub(); if(!windowOpen()&&p.clubId)return {ok:false,msg:'El mercado de fichajes está cerrado.'};
  if(p.clubId===c.id)return {ok:false,msg:'Ya es tu jugador.'};
  if(fee>c.balance)return {ok:false,msg:'No tienes saldo suficiente para esa oferta.'};
  if(!p.clubId)return {ok:true,status:'accept',fee:0};
  if(fee>=p.clause)return {ok:true,status:'accept',fee,clause:true};
  const ask=askingPrice(p);
  if(fee>=ask)return {ok:true,status:'accept',fee};
  if(fee>=ask*0.75)return {ok:true,status:'counter',counter:Math.round(((ask+fee)/2+ask*0.05)/1e5)*1e5};
  return {ok:true,status:'reject',msg:`${G.clubs[p.clubId].name} rechaza la oferta. Piden bastante más.`};
}
function wageDemand(p,toClub){
  const from=p.clubId?G.clubs[p.clubId]:null; let d=Math.max(wageFor(p.ovr),p.wage*1.12);
  if(from){const diff=from.rep-toClub.rep; d*=1+Math.max(0,diff)/35; if(diff>8&&p.pers.amb>75)return null;}
  if(euroOf(toClub.id)?.id==='UCL')d*=0.95;
  return Math.round(d*(0.95+p.pers.amb/400)/1000)*1000;
}
function offerContract(p,wage,years,fee){
  const c=userClub(); const dem=wageDemand(p,c);
  if(dem===null)return {ok:false,msg:`${p.name} no quiere bajar de nivel: rechaza unirse a ${c.name}.`};
  if(wage<dem*0.97)return {ok:false,msg:`${p.name} pide al menos ${fmtM(dem)} al año.`,demand:dem};
  const wb=wageBudget(c),bill=wageBill(c);
  if(bill+wage>wb*1.05)return {ok:false,msg:`La junta bloquea el fichaje: superarías el límite salarial (${fmtM(wb)}/año).`};
  if(fee>c.balance)return {ok:false,msg:'No hay saldo suficiente.'};
  const seller=p.clubId?G.clubs[p.clubId]:null;
  c.balance-=fee; c.fin&&(c.fin.transfers-=fee); if(seller)seller.budget+=fee*0.8;
  const best=Math.max(...c.squad.map(id=>G.players[id].ovr));
  movePlayer(p,c.id,fee,wage,years);
  if(p.ovr>=best)G.approval=clamp(G.approval+4,0,100); else if(fee>20e6)G.approval=clamp(G.approval+1.5,0,100);
  news(`${c.name} ficha a ${p.name}${seller?' ('+seller.name+')':''} por ${fee?fmtM(fee):'nada (libre)'}.`);
  return {ok:true,msg:`${p.name} ya es jugador de ${c.name}.`};
}
function renewContract(p,wage,years){
  const c=userClub(); let dem=Math.round(Math.max(wageFor(p.ovr),p.wage*1.08)*(p.morale<40?1.3:1)/1000)*1000;

  for(let i=0;i<25;i++){const o=rnd(58,74);const p=makePlayer({pos:pick(SQUAD_TEMPLATE),ovr:o,age:rint(20,32),nat:pickNat(o),season:G.season});p.clubId=null;p.contract=G.season;G.players[p.id]=p}
  if(G.mode==='pres'){const c=userClub();if(!c.sponsor||c.sponsor.until<G.season)msg('Patrocinio caducado','El contrato con tu patrocinador principal ha terminado. Elige uno nuevo en la pestaña Club.');
    const co=G.coaches[c.coachId];if(co&&co.contract<G.season){co.contract=G.season+1;msg('Entrenador','Tu entrenador ha renovado automáticamente una temporada.')}}
  if(G.mode==='player'){const p=userPlayer();if(p.age>=40&&!G.gameOver)G.gameOver={reason:'A los 40 años, cuelgas las botas. Tu carrera ha terminado.',career:true};}
  for(const lg of G.leagues)newSeasonLeague(lg);
  G.cal=buildCalendar(G.season);G.slot=0;G.lastRound=-1;G.ib=null;
  setupEuro(q);
  const myC=euroOf(userTeamId());
  if(myC)msg(`Clasificado para la ${myC.name}`,`Tu equipo jugará la ${myC.name} ${seasonStr()}.`);
  G.pre=0;G.week=1;G.summary=S;G.lastMatch=null;
  const tour=(G.season%4===0||G.season%4===2)?setupTour():null;
  if(tour){G.tour=tour;G.phase='tour';msg(`${tour.name}`,`Este verano se juega el ${tour.kind==='WC'?'Mundial':'la Eurocopa'} en ${tour.host}: ${tour.groups.length*4} selecciones. Después arranca la pretemporada.`)}
  else{G.phase='pre';msg('Nueva temporada',`Arranca la pretemporada ${seasonStr()}. El mercado está abierto durante 4 semanas.`)}
  return S;
}

// ---------- importación CSV (p. ej. datasets de EA FC / FIFA) ----------
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true; else if(ch===','){row.push(f);f=''} else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1)rows.push(row);row=[]} else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
const POS_MAP={GK:'POR',CB:'DFC',RB:'LD',RWB:'LD',LB:'LI',LWB:'LI',CDM:'MCD',CM:'MC',CAM:'MCO',RM:'ED',RW:'ED',LM:'EI',LW:'EI',ST:'DC',CF:'DC'};
function matchClub(name){
  const n=' '+norm(name)+' '; let best=null,bp=1e9,bl=0;
  for(const c of Object.values(G.clubs)) for(const k of c.keys.split('|')){const i=n.indexOf(' '+k+' ');if(i>=0&&(i<bp||(i===bp&&k.length>bl))){best=c;bp=i;bl=k.length}}
  return best;
}
function importCSV(text){
  const rows=parseCSV(text); if(rows.length<2)return {ok:false,msg:'El archivo está vacío.'};
  const h=rows[0].map(x=>x.trim().toLowerCase()); const col=(...ns)=>{for(const n of ns){const i=h.indexOf(n);if(i>=0)return i}return -1};
  const C={name:col('short_name','name','player_name','long_name'),club:col('club_name','club','team','team_name'),pos:col('player_positions','positions','position','best_position'),
    ovr:col('overall','ovr','overall_rating'),pot:col('potential'),age:col('age'),nat:col('nationality_name','nationality','nation'),
    pac:col('pace'),sho:col('shooting'),pas:col('passing'),dri:col('dribbling'),def:col('defending'),phy:col('physic','physical'),
    gk:col('goalkeeping_diving','gk_diving','goalkeeping'),val:col('value_eur'),wage:col('wage_eur'),contract:col('club_contract_valid_until_year','contract_valid_until','club_contract_valid_until')};
  if(C.name<0||C.club<0||C.ovr<0||C.pos<0)return {ok:false,msg:'Faltan columnas obligatorias (nombre, club, posición, overall).'};
  const byClub={}; let matched=0;
  for(const r of rows.slice(1)){
    const club=matchClub(r[C.club]||''); if(!club)continue;
    const ovr=+r[C.ovr]; if(!ovr)continue;
    const raw=(r[C.pos]||'').split(/[ ,]+/)[0].toUpperCase(); const pos=POS_MAP[raw]; if(!pos)continue;
    (byClub[club.id]=byClub[club.id]||[]).push({r,pos,ovr});
  }
  for(const [cid,list] of Object.entries(byClub)){
    if(list.length<14)continue; const c=G.clubs[cid];
    for(const id of c.squad)delete G.players[id]; c.squad=[];
    list.sort((a,b)=>b.ovr-a.ovr).slice(0,32).forEach(({r,pos,ovr})=>{
      const natName=C.nat>=0?r[C.nat]:''; const nat=NAT_EN[natName]||'XX';
      const p=makePlayer({pos,ovr,age:+r[C.age]||25,nat:nat==='XX'?'ES':nat,clubId:c.id});
      p.name=r[C.name]; p.nat=nat; if(nat==='XX'){p.natName=natName;p.flag=FLAG_EN[natName]||'🌍'}
      if(C.pac>=0&&r[C.pac]){for(const k of ['pac','sho','pas','dri','def','phy']){const v=+r[C[k]];if(v)p.a[k]=v}}
      if(pos==='POR'&&C.gk>=0&&+r[C.gk])p.a.gk=+r[C.gk];
      const cur=calcOvr(p),d=ovr-cur;for(const k in W[pos])p.a[k]=clamp(Math.round(p.a[k]+d),5,99);p.ovr=calcOvr(p);
      p.pot=Math.max(p.ovr,+r[C.pot]||p.pot);
      if(C.contract>=0&&+r[C.contract])p.contract=Math.max(G.season,+r[C.contract]-1);
      p.wage=C.wage>=0&&+r[C.wage]?Math.round(+r[C.wage]*52/1000)*1000:wageFor(p.ovr);
      p.value=valueOf(p); p.clause=Math.round(p.value*rnd(2.2,4.5)/1e5)*1e5;
      G.players[p.id]=p;c.squad.push(p.id);matched++;
    });
  }
  resetNT();
  return {ok:true,msg:`Importados ${matched} jugadores en ${Object.keys(byClub).filter(k=>byClub[k].length>=14).length} clubes.`};
}
function flagOf(p){return p.flag||(NATS[p.nat]?NATS[p.nat].f:'🌍')}
function natNameOf(p){return p.natName||NATS[p.nat]?.n||''}

function flagSvg(code,px){
  const [ty,...c]=NATS[code]?.fl||['h','#888','#bbb'];let g='';
  if(ty==='h'){const h=32/c.length;g=c.map((col,i)=>`<rect y="${i*h}" width="32" height="${h+0.5}" fill="${col}"/>`).join('')}
  else if(ty==='v'){const w=32/c.length;g=c.map((col,i)=>`<rect x="${i*w}" width="${w+0.5}" height="32" fill="${col}"/>`).join('')}
  else if(ty==='c')g=`<rect width="32" height="32" fill="${c[0]}"/><rect x="13" width="6" height="32" fill="${c[1]}"/><rect y="13" width="32" height="6" fill="${c[1]}"/>`;

  else if(ty==='s')g=`<rect width="32" height="32" fill="${c[0]}"/><path d="M0 0L32 32M32 0L0 32" stroke="${c[1]}" stroke-width="5"/>`;
  else g=`<rect width="32" height="32" fill="${c[0]}"/><circle cx="16" cy="16" r="8" fill="${c[1]}"/>`;
  return `<svg class="crest" width="${px}" height="${px}" viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="flc"><circle cx="16" cy="16" r="15"/></clipPath></defs><g clip-path="url(#flc)">${g}</g><circle cx="16" cy="16" r="15" fill="none" stroke="rgba(15,26,44,.35)"/></svg>`;
}
function crestSvg(t,px){
  if(!t)return '';if(t.nt)return flagSvg(t.nt,px);
  const a=t.c1||`hsl(${t.hue} 55% 34%)`,b=t.c2||'#fff',v=t.hue%5;
  const f=[`<rect width="32" height="36" fill="${a}"/><rect y="13" width="32" height="7" fill="${b}"/>`,
   `<rect width="32" height="36" fill="${a}"/><rect x="9" width="5" height="36" fill="${b}"/><rect x="19" width="5" height="36" fill="${b}"/>`,
   `<rect width="16" height="36" fill="${a}"/><rect x="16" width="16" height="36" fill="${b}"/>`,
   `<rect width="32" height="36" fill="${a}"/><path d="M-2 28L28-2h9L5 36h-7z" fill="${b}"/>`,
   `<rect width="32" height="36" fill="${a}"/><rect width="32" height="11" fill="${b}"/>`][v];
  return `<svg class="crest" width="${px}" height="${Math.round(px*1.125)}" viewBox="0 0 32 36" aria-hidden="true"><defs><clipPath id="shc"><path d="${SHIELD}"/></clipPath></defs><g clip-path="url(#shc)">${f}</g><path d="${SHIELD}" fill="none" stroke="rgba(15,26,44,.5)" stroke-width="1.3"/></svg>`;
}

function euroCard(id){

  else if(comp.champ===id)st='Campeón';else{const out=md>=8&&isOut(comp,id);st=out?`Eliminado (${STAGES[r].toLowerCase()})`:`En ${STAGES[r].toLowerCase()}`}

function isOut(comp,id){

function matchModal(res,animate){
  const H=T(res.h),A=T(res.a);const end=res.et?121:96;
  openModal(`<div class="bug"><div class="bt h" style="--c:${teamColor(H)}">${crest(H,1)}<span>${esc(H.name)}</span></div><div class="bs"><b id="sc">0–0</b><span id="mn">0'</span></div><div class="bt a" style="--c:${teamColor(A)}">${crest(A,1)}<span>${esc(A.name)}</span></div></div>
   <div class="bugsub">${esc(res.label||'')}${res.neutral?', campo neutral':H.stadium?', '+esc(H.stadium):''}</div>
   <div class="ticker" id="tk" aria-live="polite"></div><div id="mstats"></div><div class="btns" id="mbtn"><button class="btn" data-a="skipmatch">Ver resultado final</button></div>`);
  let m=0,hg=0,ag=0,shown=0;const tk=document.getElementById('tk');
  const step=()=>{m++;while(shown<res.ev.length&&res.ev[shown].m<=m){const e=res.ev[shown++];if(e.t==='goal'){e.s==='h'?hg++:ag++}
      tk.insertAdjacentHTML('afterbegin',`<div class="ev ${e.s} ${e.t}"><span class="m">${e.m}'</span><span>${evText(e)}</span></div>`)}
    const sc=document.getElementById('sc');if(!sc){clearInterval(UI.timer);return}sc.textContent=`${hg}–${ag}`;
    document.getElementById('mn').textContent=m>=end?(res.pen?`Penaltis ${res.pen[0]}-${res.pen[1]}`:res.et?'Final, prórroga':'Final'):m>90&&!res.et?'90+':m+"'";
    if(m>=end){clearInterval(UI.timer);finishMatch(res)}};
  clearInterval(UI.timer);
  if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)UI.timer=setInterval(step,55);else{for(let i=0;i<end;i++)step()}
  UI.skip=()=>{clearInterval(UI.timer);while(m<end)step()};
}
function finishMatch(res){
  const st=res.st;const box=document.getElementById('mstats');if(!box)return;const H=T(res.h),A=T(res.a);
  const cmp=(l,a,b,f=v=>v)=>{const t=a+b||1;return `<div class="cmp" style="--hc:${teamColor(H)};--ac:${teamColor(A)}"><span class="t">${l}</span><span class="v">${f(a)}</span><div class="b"><i style="width:${a/t*100}%"></i><em style="width:${b/t*100}%"></em></div><span class="v">${f(b)}</span></div>`};
  const me=res.me??userTeamId();const side=res.h===me?'h':'a';const xi=side==='h'?res.hx:res.ax;
  const rows=xi.map(x=>({p:G.players[x.pid],r:res.rat[x.pid]})).concat(res.sub&&res.sub.s===side?[{p:G.players[res.sub.pid],r:res.rat[res.sub.pid],sub:1}]:[]).filter(x=>x.p).sort((a,b)=>b.r-a.r);
  box.innerHTML=`<h3>Estadísticas</h3>${cmp('Posesión',res.poss,100-res.poss,v=>v+'%')}${cmp('Remates',st.h.sh,st.a.sh)}${cmp('A puerta',st.h.sot,st.a.sot)}${cmp('Goles esperados (xG)',+st.h.xg.toFixed(2),+st.a.xg.toFixed(2),v=>v.toFixed(2))}${cmp('Córners',st.h.co,st.a.co)}${cmp('Tarjetas',st.h.yc+st.h.rc,st.a.yc+st.a.rc)}
  <h3>Notas de tu equipo</h3><div class="list">${rows.map(x=>`<div class="it" ${x.p.isUser?'style="background:color-mix(in srgb,var(--amber) 16%,transparent)"':''}>${posTag(x.p.pos)}<span class="grow nm">${esc(x.p.name)}${x.sub?' <span class="mute small">(desde el banquillo)</span>':''}</span>${fitBar(x.p)}<b class="num ${x.r>=7.5?'win':x.r<6?'red':''}" style="width:34px;text-align:right">${x.r.toFixed(1)}</b></div>`).join('')}</div>`;
  document.getElementById('mbtn').innerHTML=`<button class="btn pri full" data-a="close">Continuar</button>`;
}
function summaryModal(){
  const S=G.summary;if(!S)return;const u=S.user;
  let user='';
  if(G.mode==='pres')user=`<div class="card"><b>${esc(userClub().name)}: ${u.pos}º</b><p class="small ${u.met?'win':'red'}">Objetivo de liga "${esc(u.obj)}": ${u.met?'cumplido':'no cumplido'}.</p>
    ${u.eobj?`<p class="small ${u.emet?'win':'red'}">Objetivo europeo "${esc(u.eobj)}": ${u.emet?'cumplido':'no cumplido'}.</p>`:''}${u.ereach?`<p class="small mute">${esc(u.ereach)}</p>`:''}
    <p class="small mute">Apoyo de los socios: ${Math.round(u.approval)}%. Saldo ${fmtM(u.balance)}${S.prize?'. Premio por posición '+fmtM(S.prize):''}</p>
    ${S.election?`<p class="small ${S.election.won?'win':'red'}">Elecciones: ${S.election.won?'reelegido con el '+S.election.pct+'% de los votos.':'derrota electoral.'}</p>`:''}</div>`;
  else user=`<div class="card"><b>${esc(u.club)}: ${u.pos}º</b><p class="small">${u.apps} partidos, ${u.g} goles (${u.eg||0} en Europa), ${u.as} asistencias, nota ${u.avg}</p><p class="small mute">Media al cierre: ${u.ovr}. Internacional: ${u.caps} partidos, ${u.ig} goles.</p></div>`;
  openModal(`<h2>Temporada ${S.season}/${String(S.season+1).slice(2)}</h2>${user}
  ${S.euro.map(e=>`<div class="card row">${crest(G.clubs[e.champ])}<div class="grow"><div>${compTag('E',e.id,e.name)}</div><div class="nm" style="margin-top:4px">${esc(G.clubs[e.champ].name)}</div><div class="sub">Final ante ${esc(G.clubs[e.runner].name)}</div></div></div>`).join('')}
  ${S.leagues.map(l=>`<div class="card"><div class="row">${crest(G.clubs[l.champ])}<div class="grow"><div class="small mute">${esc(l.name)}, campeón</div><div class="nm">${esc(G.clubs[l.champ].name)}</div></div></div>
   <p class="small" style="margin-top:8px">Máximo goleador: ${l.top?esc(l.top.name)+' ('+l.top.g+')':'–'}<br>Asistencias: ${l.ast?esc(l.ast.name)+' ('+l.ast.as+')':'–'}<br>Mejor jugador: ${l.mvp?esc(l.mvp.name)+' ('+l.mvp.r+')':'–'}</p></div>`).join('')}
  ${G.tour?`<p class="small mute">Este verano: ${esc(G.tour.name)} en ${esc(G.tour.host)}.</p>`:''}
  <div class="btns"><button class="btn pri" data-a="closesum">Continuar</button></div>`);
}
function tourSummaryModal(){
  const t=G.lastTour;if(!t)return;const h=G.ntHistory[0];G.tourJustEnded=false;
  openModal(`<div class="row" style="margin-top:24px">${flagSvg(t.champ,64)}<div><div class="small mute">${esc(t.name)}, campeón</div><h2 style="margin:4px 0 0">${esc(NATS[t.champ].n)}</h2></div></div>
  <p style="margin-top:12px">Final ante ${esc(NATS[t.runner].n)}${t.ko.at(-1)[0].r?`: ${t.ko.at(-1)[0].r.hg}-${t.ko.at(-1)[0].r.ag}${t.ko.at(-1)[0].r.pen?` (penaltis ${t.ko.at(-1)[0].r.pen[0]}-${t.ko.at(-1)[0].r.pen[1]})`:''}`:''}.</p>
  ${h&&h.top?`<p class="small mute">Máximo goleador: ${esc(h.top.name)} (${esc(NATS[h.top.nat]?.n||'')}), ${h.top.g} goles.</p>`:''}
  <div class="btns"><button class="btn" data-a="gocomp" data-x="NAT">Ver el torneo</button><button class="btn pri" data-a="closesum">Ir a la pretemporada</button></div>`);
}
function momentsFlow(fx,role){
  const ms=makeMoments(role);let i=0;const forced=[];
  const show=()=>{
    if(i>=ms.length){closeModal();runWeek(forced,role==='sub'?{pid:G.userPlayerId,club:fx.me}:null);return}
    const mo=ms[i];const H=T(fx.h),A=T(fx.a);
    openModal(`<div class="row sp" style="margin-top:6px">${compTag(fx.kind,fx.comp,fx.label)}<span class="small mute">${role==='sub'?'Sales desde el banquillo':'Titular'}</span></div><p class="small mute" style="margin-top:8px">${esc(H.name)} – ${esc(A.name)}</p><h2>Minuto ${mo.m}</h2><p class="moment">${esc(mo.t)}</p>
     <div id="mo">${mo.o.map((o,k)=>`<button class="btn full" style="margin:6px 0;justify-content:space-between" data-a="mopt" data-x="${k}">${esc(o[0])} <span class="mute small">${ATTR_ES[o[1]]} ${userPlayer().a[o[1]]}</span></button>`).join('')}</div>`,true);
    UI.mopt=k=>{const r=resolveMoment(mo,k,fx);forced.push(r.f);document.getElementById('mo').innerHTML=`<div class="card ${r.ok?'win':'red'}" style="font-size:1.1rem">${esc(r.txt)}</div><button class="btn pri full" data-a="mnext">${i+1<ms.length?'Seguir jugando':'Ver el partido'}</button>`;UI.mnext=()=>{i++;show()}};
  };
  show();
}

// ---------- avance ----------
function doAdvance(){
  if(G.gameOver)return;
  if(G.mode==='player'&&(G.phase==='season'||G.phase==='tour')){const fx=userFixture();if(fx){const r=userRole(fx);
    if(r.role==='starter'||r.role==='sub')return momentsFlow(fx,r.role);
    if(r.role==='bench')toast(String(fx.me).startsWith('N:')?'El seleccionador te deja en el banquillo.':'El entrenador no cuenta contigo esta jornada: te quedas en el banquillo.');
    if(r.role==='out')toast('No estás disponible para este partido.');}}
  runWeek(null,null);
}
function runWeek(forced,sub){
  const r=advance(forced,sub);if(!r)return;save();
  if(r.type==='pre'&&G.phase==='season')toast('Empieza la temporada');
  render();
  if(r.userRes)matchModal(r.userRes,true);
  if(r.type==='end'){if(r.userRes)UI.pendingSummary=true;else summaryModal()}
  if(r.type==='tourEnd'){if(r.userRes)UI.pendingTour=true;else tourSummaryModal()}
}

// ---------- acciones ----------
const ACT={
  tab:x=>{UI.tab=x;render();scrollTo(0,0)},
  screen:x=>{UI.screen=x;render()},
  newlg:x=>{UI.newLg=x;render()},
  continue:()=>{if(load()){UI.screen='game';UI.tab='home';render()}else toast('La partida guardada es de una versión anterior y no se puede abrir.')},
  newgame:()=>{if(confirm('¿Empezar una partida nueva? Se borrará la actual.')){try{localStorage.removeItem(SAVE_KEY)}catch(e){}G=null;UI.screen='start';closeModal();render()}},
  pickclub:x=>{newWorld('pres');applyCSV();const L=LEAGUES_DATA.find(l=>l.id===UI.newLg);const name=L.clubs[+x][0];
    G.userClubId=Object.values(G.clubs).find(c=>c.name===name).id;const c=userClub();c.fin=finBlank();
    const eu=euroOf(c.id);
    msg('Bienvenido, presidente',`Has sido elegido presidente de ${c.name}. Tienes ${fmtM(c.balance)} en caja. El mercado está abierto durante la pretemporada.${eu?` Esta temporada jugáis la ${eu.name}.`:''} Las próximas elecciones serán dentro de cuatro temporadas.`);
    UI.screen='game';UI.tab='home';UI.comp=null;save();render()},
  startplayer:()=>{const n=document.getElementById('pn').value.trim();if(!n)return toast('Escribe un nombre para tu jugador.');
    const pos=document.getElementById('ppos').value;
    newWorld('player');applyCSV();createUserPlayer({name:n,nat:document.getElementById('pnat').value,pos,leagueId:document.getElementById('plg').value});
    G.training.focus=pos==='POR'?'porteria':['DFC','LD','LI','MCD'].includes(pos)?'defensa':pos==='DC'?'tiro':'tecnica';
    UI.screen='game';UI.tab='home';UI.comp=null;save();render()},
  advance:()=>doAdvance(),
  menu:()=>{const th=lsGet(THEME_KEY)||'auto';openModal(`<h2>Partida</h2><div class="small mute">Tema</div><div class="chips">${[['auto','Automático'],['light','Claro'],['dark','Noche']].map(([k,l])=>`<button class="chip ${th===k?'on':''}" data-a="theme" data-x="${k}">${l}</button>`).join('')}</div>
    <div class="btns" style="flex-direction:column"><button class="btn" data-a="export">Exportar partida (.json)</button><button class="btn" data-a="tomenu">Volver al menú principal</button><button class="btn dan" data-a="newgame">Borrar y empezar de nuevo</button></div><p class="small mute" style="margin-top:12px">La partida se guarda automáticamente en este navegador cada vez que avanzas.</p>`)},
  theme:x=>{lsSet(THEME_KEY,x);applyTheme();ACT.menu()},
  export:()=>{const b=new Blob([JSON.stringify(G)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`palco_${G.season}.json`;a.click()},
  tomenu:()=>{save();closeModal();UI.screen='start';render()},
  close:()=>{closeModal();if(UI.pendingSummary){UI.pendingSummary=false;render();summaryModal()}else if(UI.pendingTour){UI.pendingTour=false;render();tourSummaryModal()}else render()},
  closesum:()=>{closeModal();render()},
  bgclose:(x,el,ev)=>{if(ev.target===el)ACT.close()},
  sq:x=>{UI.sq=x;render()},
  mk:(x,el)=>{const k=el.dataset.k;UI.mkt[k]=k==='free'?x==='true':['max','min'].includes(k)?+x:x;render()},
  player:x=>playerModal(+x),
  club:x=>{const c=G.clubs[+x];if(!c)return;const ps=c.squad.map(id=>G.players[id]).sort((a,b)=>POSS.indexOf(a.pos)-POSS.indexOf(b.pos)||b.ovr-a.ovr);const co=G.coaches[c.coachId];
    const et=Object.entries(c.euroTitles||{}).filter(e=>e[1]).map(([k,n])=>`${n} ${COMP_NAME[k]}`).join(', ');const eu=euroOf(c.id);
    openModal(`<div class="row" style="margin-top:4px">${crestSvg(c,48)}<div><h2 style="margin:0">${esc(c.name)}</h2><div class="sub">${esc(compName(c))}${eu?', '+eu.name:''}</div><div class="sub">${esc(c.stadium)}, ${c.cap.toLocaleString('es-ES')} espectadores</div></div></div>
    <p class="small mute" style="margin:10px 0">Entrenador: ${co?esc(co.name)+' ('+co.style.toLowerCase()+', '+co.q+')':'–'}. Media del once: ${Math.round(clubBase(c))}.${c.titles?` ${c.titles} liga(s) en tu partida.`:''}${et?` ${et}.`:''}</p><div class="list">${ps.map(p=>playerRow(p,`${p.age} años, ${fmtM(p.value)}`)).join('')}</div>`)},
  comp:x=>{UI.comp=x;render()},
  gocomp:x=>{closeModal();UI.tab='comp';UI.comp=x;render();scrollTo(0,0)},
  viewmatch:()=>G.lastMatch&&matchModal(G.lastMatch,false),
  summary:()=>summaryModal(),
  skipmatch:()=>UI.skip&&UI.skip(),
  neg:x=>negForm(x),
  sendbid:()=>{const p=G.players[UI.neg.pid];const fee=Math.round(+document.getElementById('nfee').value*1e6);const r=makeBid(p,fee);
    if(!r.ok)return toast(r.msg);
    if(r.status==='accept'){UI.neg.fee=fee;toast(`${G.clubs[p.clubId].name} acepta. Ahora negocia con el jugador.`);negForm('contract')}
    else if(r.status==='counter'){document.getElementById('nfee').value=(r.counter/1e6).toFixed(1);toast(`Contraoferta: piden ${fmtM(r.counter)}.`)}
    else toast(r.msg)},
  clause:x=>{const p=G.players[+x];if(!windowOpen())return toast('El mercado de fichajes está cerrado.');if(userClub().balance<p.clause)return toast('No tienes saldo para pagar la cláusula.');UI.neg={pid:p.id,fee:p.clause};negForm('contract')},
  sendcontract:()=>{const p=G.players[UI.neg.pid];const w=Math.round(+document.getElementById('nwage').value*1e6/1000)*1000,y=+document.getElementById('nyrs').value;
    const r=UI.neg.kind==='renew'?renewContract(p,w,y):offerContract(p,w,y,UI.neg.fee||0);
    if(r.demand)document.getElementById('nwage').value=(r.demand/1e6).toFixed(2);
    toast(r.msg);if(r.ok){save();closeModal();render()}},
  list:x=>{const p=G.players[+x];p.listed=!p.listed;save();playerModal(p.id,p.listed?'Jugador en la lista de transferibles. Recibirás más ofertas por él.':null)},
  release:x=>{const p=G.players[+x];const yl=Math.max(1,p.contract-G.season);if(confirm(`¿Rescindir a ${p.name}? Le pagarás unos ${fmtM(p.wage*yl*0.6)} de indemnización.`)){const c=releasePlayer(p);toast(`${p.name} queda libre. Coste: ${fmtM(c)}.`);save();closeModal();render()}},
  offacc:x=>{const m=G.inbox.find(m=>m.id===+x);const e=acceptOfferIn(m);toast(e||'Traspaso cerrado.');save();render()},
  offrej:x=>{const m=G.inbox.find(m=>m.id===+x);rejectOfferIn(m);save();render()},
  coaches:()=>{const fr=Object.values(G.coaches).filter(c=>!c.clubId).sort((a,b)=>b.q-a.q);
    openModal(`<h2>Entrenadores libres</h2><p class="small mute">Despedir al actual cuesta su salario pendiente. La calidad y el estilo afectan al rendimiento del equipo.</p><div class="list">${fr.map(c=>`<div class="it"><span class="ovr ${ovrCls(c.q)}">${c.q}</span><div class="grow"><div class="nm">${NATS[c.nat]?.f||''} ${esc(c.name)}</div><div class="sub">${c.style}, ${c.age} años, ${fmtM(c.wage)}/año</div></div><button class="btn" data-a="hire" data-x="${c.id}">Contratar</button></div>`).join('')}</div>`)},
  hire:x=>{const co=G.coaches[+x];if(confirm(`¿Contratar a ${co.name} y destituir al entrenador actual?`)){hireCoach(co);save();closeModal();render();toast(`${co.name} es tu nuevo entrenador.`)}},
  ticket:x=>{const c=userClub();c.ticket=clamp(c.ticket+ +x,5,250);save();render()},
  sponsor:x=>{const c=userClub(),o=sponsorOffers(c)[+x];c.sponsor={name:o.name,annual:o.annual,until:G.season+o.years-1};news(`${c.name} firma con ${o.name} como patrocinador principal.`);save();render()},
  upg:x=>{const e=upgrade(x);toast(e||'Obra aprobada.');save();render()},
  trf:x=>{G.training.focus=x;save();render()}, tri:x=>{G.training.intensity=+x;save();render()},
  renewme:()=>{toast(requestRenewal());save();render()},
  leave:()=>{toast(requestTransfer());save();render()},
  pacc:x=>{const o=G.playerOffers[+x];if(!windowOpen())return toast('El mercado está cerrado.');if(confirm(`¿Fichar por ${G.clubs[o.club].name}?`)){acceptPlayerOffer(o);save();render();toast(`Nuevo jugador de ${G.clubs[o.club].name}.`)}},
  retire:()=>{if(confirm('¿Seguro que quieres retirarte?')){G.gameOver={reason:`Te retiras a los ${userPlayer().age} años.`,career:true};save();render()}},
  mopt:x=>UI.mopt(+x), mnext:()=>UI.mnext()
};
function applyCSV(){if(UI.csv){const r=importCSV(UI.csv);setTimeout(()=>toast(r.msg),300);if(r.ok){for(const lg of G.leagues)newSeasonLeague(lg);setupEuro(euroQualify(true))}}}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f){if(el.dataset.a!=='bgclose')ev.stopPropagation();f(el.dataset.x,el,ev)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$modal.innerHTML&&!$modal.querySelector('.modal:not([data-a])'))ACT.close();
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.it.tap,[data-a="club"]')){ev.preventDefault();ev.target.click()}});
document.addEventListener('change',ev=>{const el=ev.target;
  if(el.dataset.c==='csv'&&el.files[0]){const r=new FileReader();r.onload=()=>{UI.csv=r.result;toast('CSV cargado. Se aplicará al crear la partida.');render()};r.readAsText(el.files[0])}
  if(el.dataset.c==='loadjson'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const g=JSON.parse(r.result);if(g.v!==2)throw 0;G=g;resetNT();save();UI.screen='game';UI.tab='home';render()}catch(e){toast('Ese archivo no es una partida válida de esta versión.')}};r.readAsText(el.files[0])}
});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.c==='mq'){UI.mkt.q=el.value;clearTimeout(UI.qt);UI.qt=setTimeout(()=>{render();const i=document.querySelector('[data-c=mq]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},350)}});
applyTheme();render();
